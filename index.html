<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{--sat:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Normatec Rental Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="วางแผนธุรกิจให้เช่าเครื่อง Normatec: ตั้งราคา ใบราคา ลูกค้า ต้นทุน และคืนทุน">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Normatec">
<meta name="application-name" content="Normatec">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: Hyperice-style black header band, desktop top tabs / phone bottom tab bar, single-column cards. Monochrome CI with one blue data accent. */
:root{
  --bg:#ffffff; --surface:#f4f4f2; --surface-2:#e9e9e6; --ink:#0b0b0c; --muted:#5f6267; --line:#e2e2df;
  --bar:#0b0b0c; --bar-ink:#ffffff; --btn:#0b0b0c; --btn-ink:#ffffff; --sheet:#ffffff; --scrim:rgba(0,0,0,.45);
  --c1:#0b0b0c; --c2:#3a6ff7; --c3:#17907d; --c4:#d99410; --c5:#a3a8ad;
  --good:#16834a; --warn:#b26a00; --bad:#c62828; --good-bg:#e5f3ea; --warn-bg:#fcf0dc; --bad-bg:#fbe6e6;
  --display:"Kanit","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans Thai","Helvetica Neue",Arial,sans-serif;
  --r:6px; --pill:999px; --ease:cubic-bezier(.2,.8,.2,1);
  --navh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --surface:#161618; --surface-2:#232326; --ink:#f3f3f1; --muted:#a6a9ae; --line:#2c2c30;
  --bar:#000000; --bar-ink:#ffffff; --btn:#f3f3f1; --btn-ink:#0b0b0c; --sheet:#161618; --scrim:rgba(0,0,0,.6);
  --c1:#f3f3f1; --c2:#7097ff; --c3:#3cc3ac; --c4:#f2b940; --c5:#6f7479;
  --good:#4cc47f; --warn:#f0a63a; --bad:#ff6b6b; --good-bg:#11301e; --warn-bg:#33240d; --bad-bg:#3a1515;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --surface:#161618; --surface-2:#232326; --ink:#f3f3f1; --muted:#a6a9ae; --line:#2c2c30;
  --bar:#000000; --bar-ink:#ffffff; --btn:#f3f3f1; --btn-ink:#0b0b0c; --sheet:#161618; --scrim:rgba(0,0,0,.6);
  --c1:#f3f3f1; --c2:#7097ff; --c3:#3cc3ac; --c4:#f2b940; --c5:#6f7479;
  --good:#4cc47f; --warn:#f0a63a; --bad:#ff6b6b; --good-bg:#11301e; --warn-bg:#33240d; --bad-bg:#3a1515;
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
a{color:var(--c2)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c2);outline-offset:2px}

/* header */
.topbar{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;z-index:30;padding-top:var(--sat,0px)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:15px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-mark{display:grid;gap:3px;width:18px}
.brand-mark i{display:block;height:4px;border-radius:4px;background:#fff}
.brand-mark i:nth-child(2){width:84%;margin:0 auto}.brand-mark i:nth-child(3){width:68%;margin:0 auto}
.topnav{display:flex;gap:2px;margin-left:12px;overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav button{background:none;border:0;color:rgba(255,255,255,.62);font-family:var(--display);font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;padding:18px 10px 16px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.topnav button:hover{color:#fff}
.topnav button[aria-current="page"]{color:#fff;border-bottom-color:#fff}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:var(--pill);padding:6px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn:disabled{opacity:.35;cursor:default}
.hbtn svg{width:15px;height:15px}
.save-dot{width:8px;height:8px;border-radius:50%;background:#4cc47f;display:inline-block}
.save-dot[data-s="saving"]{background:#f0a63a}.save-dot[data-s="err"]{background:#ff6b6b}.save-dot[data-s="local"]{background:#9aa0a6}

/* bottom nav (phones) */
.botnav{display:none}
@media (max-width:760px){
  .topnav{display:none}
  .botnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .botnav button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:8px 2px 6px;font-size:11px;color:var(--muted);cursor:pointer;min-height:var(--navh)}
  .botnav svg{width:22px;height:22px}
  .botnav button[aria-current="page"]{color:var(--ink)}
  .botnav button[aria-current="page"] svg{transform:translateY(-1px)}
  main{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 24px)!important}
  .hide-sm{display:none!important}
}

main{padding-block:24px 64px}
.view{display:grid;gap:22px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.page-title{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.page-title h1{font-size:clamp(26px,5vw,40px);text-transform:uppercase;line-height:1.05;margin-top:4px}
.lead{color:var(--muted);max-width:62ch;margin:6px 0 0;font-size:14.5px}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes flash{0%{background:var(--surface-2)}100%{background:transparent}}
.view.enter > *{animation:rise .42s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
.pop{animation:pop .28s var(--ease)}
::view-transition-old(main-view){animation:vt-out .16s ease-in both}
::view-transition-new(main-view){animation:vt-in .32s var(--ease) both}
@keyframes vt-out{to{opacity:0;transform:translateY(-6px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}
#app{view-transition-name:main-view}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* buttons */
.btn{appearance:none;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);font-family:var(--display);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:11px 18px;border-radius:var(--pill);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:7px 13px;font-size:12px}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn svg{width:16px;height:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--pill);padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,transform .12s}
.chip:active{transform:scale(.96)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.soft{background:var(--surface);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scroll-x{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroll-x::-webkit-scrollbar{display:none}

/* cards */
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.card.flat{background:var(--surface);border-color:transparent}
.card h3{font-size:16px;text-transform:uppercase;letter-spacing:.05em}
.hint{font-size:13px;color:var(--muted);margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}

/* summary */
.verdict{background:var(--bar);color:var(--bar-ink);border-radius:var(--r);padding:24px;display:grid;gap:14px}
.verdict .sentence{font-family:var(--display);font-size:clamp(20px,3.4vw,30px);line-height:1.3;font-weight:500}
.verdict .sentence b{font-weight:700}
.verdict .light{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:5px 12px;border-radius:var(--pill);background:rgba(255,255,255,.1);width:max-content}
.verdict .light i{width:10px;height:10px;border-radius:50%;display:inline-block}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bigstat{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:2px;min-width:0}
.bigstat .l{font-size:13px;color:var(--muted)}
.bigstat .v{font-family:var(--display);font-size:clamp(22px,4vw,34px);font-weight:600;line-height:1.15}
.bigstat .s{font-size:12.5px;color:var(--muted)}
@media (max-width:560px){.big3{grid-template-columns:1fr}.bigstat{grid-template-columns:1fr auto;align-items:baseline}.bigstat .s{grid-column:1/-1}}
.hbar{display:grid;gap:10px}
.hbar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.hbar-row .t{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-row .v{font-size:14px;font-weight:600}
.hbar-track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.hbar-fill{height:100%;border-radius:8px;transition:width .5s var(--ease)}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;background:var(--surface);border-radius:var(--r);font-size:14px}
.todo .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
.ic.good{background:var(--good-bg);color:var(--good)}.ic.warn{background:var(--warn-bg);color:var(--warn)}.ic.bad{background:var(--bad-bg);color:var(--bad)}.ic.info{background:var(--surface-2);color:var(--ink)}
.todo .act{margin-top:6px}

/* sliders */
.slider{display:grid;gap:6px}
.slider .top{display:flex;justify-content:space-between;font-size:14px}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}

/* pricing studio */
.prog{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;background:var(--bg);transition:opacity .2s}
.prog.off{opacity:.5}
.prog-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.prog-name{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.25;min-width:0}
.prog-desc{font-size:13px;color:var(--muted);margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:var(--pill);padding:3px 10px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tag.good{background:var(--good-bg);color:var(--good)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;border:1px solid var(--line);border-radius:var(--pill);overflow:hidden;height:48px;background:var(--bg)}
.stepper button{height:100%;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--ink)}
.stepper button:active{background:var(--surface)}
.stepper input{border:0;background:transparent;text-align:center;font-family:var(--display);font-size:20px;font-weight:600;width:100%;min-width:0;color:var(--ink);padding:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper.sm{height:40px;grid-template-columns:38px minmax(0,1fr) 38px}
.stepper.sm input{font-size:16px}
.field-lab{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:block}
.prog-controls{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
@media (max-width:420px){.prog-controls{grid-template-columns:1fr}}
.meter{position:relative;height:38px;margin-top:4px}
.meter .rail{position:absolute;left:0;right:0;top:14px;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--bad-bg) 0%,var(--bad-bg) var(--floor),var(--good-bg) var(--floor),var(--good-bg) var(--mkt),var(--warn-bg) var(--mkt),var(--warn-bg) 100%)}
.meter .mk{position:absolute;top:6px;width:2px;height:24px;background:var(--muted);transform:translateX(-1px)}
.meter .mk span{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap}
.meter .me{position:absolute;top:8px;width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ink);transform:translateX(-10px);transition:left .35s var(--ease)}
.facts-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.facts-row b{color:var(--ink);font-weight:600}
.result-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.result-row b{font-family:var(--display);font-weight:600;font-size:17px}
.flash{animation:flash .6s ease-out}

/* lists */
.rows{display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;background:var(--bg);cursor:pointer;transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface)}
.row .t{font-weight:600;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.row .r{text-align:right;font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap}
.row .rs{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:flex;height:14px;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.seg span{display:block;height:100%;transition:width .5s var(--ease)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* forms in sheets */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .wide{grid-column:1/-1}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:12.5px;color:var(--muted)}
.f .help{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=url],input[type=number].plain,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;font:inherit;font-size:16px}
textarea{min-height:80px;font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}

/* sheet (modal) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:51;left:50%;bottom:0;width:min(640px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);background:var(--sheet);border-radius:14px 14px 0 0;
  transform:translate(-50%,100%);transition:transform .34s var(--ease);display:grid;grid-template-rows:auto minmax(0,1fr) auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.show{transform:translate(-50%,0)}
@media (min-width:761px){.sheet{bottom:auto;top:50%;border-radius:14px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .3s var(--ease),opacity .2s}.sheet.show{transform:translate(-50%,-50%);opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:16px;text-transform:uppercase;letter-spacing:.05em}
.sheet-body{overflow:auto;padding:18px;display:grid;gap:16px;align-content:start}
.sheet-foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:18px;line-height:1}
.tpl{display:grid;gap:10px}
.tpl button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px;cursor:pointer;display:grid;gap:2px}
.tpl button:hover{border-color:var(--ink)}
.tpl b{font-family:var(--display);font-size:16px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 16px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--pill);font-size:14px;z-index:60;opacity:0;transition:all .3s var(--ease);pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:761px){.toast{bottom:24px}}

/* price list sheet (customer facing) */
.pl-wrap{overflow-x:auto;padding:4px}
.pl{width:760px;margin:0 auto;background:#ffffff;color:#0b0b0c;font-family:var(--body);border:1px solid #e2e2df}
.pl.story{width:540px}
.pl.dark{background:#0b0b0c;color:#f3f3f1;border-color:#2c2c30}
.pl-head{background:#0b0b0c;color:#fff;padding:34px 36px 28px;display:grid;gap:10px}
.pl.dark .pl-head{background:#000;border-bottom:1px solid #2c2c30}
.pl-brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;letter-spacing:.24em;font-size:14px;text-transform:uppercase}
.pl-title{font-family:var(--display);font-size:40px;font-weight:700;text-transform:uppercase;line-height:1.02}
.pl-sub{font-size:14px;opacity:.75}
.pl-date{font-size:12px;opacity:.6;letter-spacing:.06em}
.pl-body{padding:26px 36px 8px;display:grid;gap:26px}
.pl-group h4{font-family:var(--display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 6px;padding-bottom:8px;border-bottom:2px solid currentColor;display:flex;justify-content:space-between}
.pl-group h4 span{font-family:var(--body);letter-spacing:0;text-transform:none;font-weight:400;opacity:.6;font-size:12px}

    S.clubs.forEach(c=>{ if(!clubActive(c,mi)) return; clubBookings(c).forEach(b=>{ Object.keys(z).forEach(k=>z[k]+=b[k]); byClub[c.id]=(byClub[c.id]||0)+b.revenue; byPkg[b.pkg.id]=(byPkg[b.pkg.id]||0)+b.revenue; }); });
    personal.forEach(b=>{ Object.keys(z).forEach(k=>z[k]+=b[k]); byPkg[b.pkg.id]=(byPkg[b.pkg.id]||0)+b.revenue; });

    return Object.assign(z,{loss,fixed,tax,cost:z.variable+loss+fixed+tax,net:ebitda-tax,byClub,byPkg});
  }

  for(let i=1;i<=H;i++){ const mo=month(i); const prev=cum; cum+=mo.net; mo.cum=cum; mo.i=i; mo.ym=addMonths(o.planStart,i-1); if(pay==null&&cum>=0) pay=(i-1)+(mo.net>0?(-prev)/mo.net:0); series.push(mo); }

}
function floorFor(pkg,R){ const b=bookingOf(pkg,{}), per=pkg.kind==="weekly"?1:Math.max(.0001,b.occ), u=Math.max(1,b.units); const cost=(b.variable+b.busy*R.capDay)/per/u; return {target:cost/Math.max(.05,1-R.lossPct), cash:(b.variable/per/u)/Math.max(.05,1-R.lossPct)}; }
const refTHB=r=>n(r.price)*n(S.fx[r.currency]||1);
const refDays=r=>UNIT_DAYS[r.unit]?Math.max(1,n(r.qty))*UNIT_DAYS[r.unit]:null;

function marketFor(pkg){
  const b=bookingOf(pkg,{}); const rents=S.refs.filter(r=>r.kind==="rent"&&r.bench!==false&&n(r.price)>0&&refDays(r));
  const blen=pkg.kind==="weekly"?(pkg.leave?7:1):Math.max(1,n(pkg.useDays));

/* ---- calendar: real dates ---- */
function monthEvents(ym){
  const [y,m]=ym.split("-").map(Number), first=new Date(y,m-1,1), last=new Date(y,m,0);
  const map={}; const slot=d=>{ const k=dkey(d); return map[k]=map[k]||{ev:[],use:0}; };
  const inMonth=d=>d>=first&&d<=last, mi=monthIndexOf(ym);
  S.clubs.forEach(c=>{
    const p=pkgById(c.packageId); if(!p||!p.on) return;
    const units=Math.max(1,n(c.units||p.units||1));
    if(clubActive(c,mi)&&p.kind==="weekly"){
      const days=(c.days&&c.days.length)?c.days:(p.days||[]);
      const idx=ORDER.map((x,i)=>days.includes(x)?i:-1).filter(i=>i>=0);
      for(let d=new Date(first); d<=last; d.setDate(d.getDate()+1)){
        const wd=d.getDay(), pos=ORDER.indexOf(wd);
        if(!p.leave){ if(days.includes(wd)){ const s=slot(d); s.ev.push({dir:"out",c,units,pk:p},{dir:"in",c,units,pk:p}); s.use+=units; } }
        else if(idx.length){ if(pos>=idx[0]&&pos<=idx[idx.length-1]) slot(d).use+=units; if(pos===idx[0]) slot(d).ev.push({dir:"out",c,units,pk:p}); if(pos===idx[idx.length-1]) slot(d).ev.push({dir:"in",c,units,pk:p}); }
      }
    }
    const mp=p.kind==="match"?p:(c.addMatch&&p.kind==="weekly"?matchPkg():null);
    if(mp&&n(c.matches)>0){
      [addMonths(ym,-1),ym].forEach(mm=>{
        if(!clubActive(c,monthIndexOf(mm))) return;
        const [yy,mo]=mm.split("-").map(Number), ds=[];
        for(let d=new Date(yy,mo-1,1); d.getMonth()===mo-1; d.setDate(d.getDate()+1)) if(d.getDay()===n(c.matchDay)) ds.push(new Date(d));
        const k=Math.min(ds.length,Math.round(n(c.matches)));
        for(let j=0;j<k;j++){ const md=ds[Math.floor(j*ds.length/k)], len=Math.max(1,n(mp.useDays)), back=new Date(md); back.setDate(back.getDate()+len);
          if(inMonth(md)) slot(md).ev.push({dir:"out",c,units,pk:mp,match:true});
          if(inMonth(back)) slot(back).ev.push({dir:"in",c,units,pk:mp,match:true});
          for(let t=0;t<len;t++){ const od=new Date(md); od.setDate(od.getDate()+t); if(inMonth(od)) slot(od).use+=units; } }
      });
    }
    if(p.kind==="event"&&c.eventStart&&clubActive(c,null)){
      const s=new Date(c.eventStart+"T00:00:00");
      if(!isNaN(s)){ const len=Math.max(1,n(p.useDays)), back=new Date(s); back.setDate(back.getDate()+len);
        if(inMonth(s)) slot(s).ev.push({dir:"out",c,units,pk:p}); if(inMonth(back)) slot(back).ev.push({dir:"in",c,units,pk:p});
        for(let t=0;t<len;t++){ const od=new Date(s); od.setDate(od.getDate()+t); if(inMonth(od)) slot(od).use+=units; } }
    }
  });
  return map;
}
function upcoming(days){
  const res=[], start=new Date(); start.setHours(0,0,0,0);
  const ps=S.ops.planStart.split("-").map(Number), planD=new Date(ps[0],ps[1]-1,1); if(start<planD) start.setTime(planD.getTime());
  const cache={};
  for(let i=0;i<days;i++){ const d=new Date(start); d.setDate(d.getDate()+i); const ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    const mp=cache[ym]||(cache[ym]=monthEvents(ym)), e=mp[dkey(d)]; if(e&&e.ev.length) res.push({d,e}); }
  return res;
}

let docRef=null,saveTimer=null,saving=false,again=false,lastJSON="",loadTimer=null,saveState="local";
const saveTexts=()=>({local:L("บันทึกในเครื่อง","Saved on device"),saving:L("กำลังบันทึก","Saving"),ok:L("บันทึกแล้ว","Saved"),err:L("บันทึกไม่สำเร็จ","Not saved"),view:L("ดูอย่างเดียว","View only")});
function setSave(s){ saveState=s; $("#saveDot").dataset.s=s==="view"?"err":s; $("#saveTxt").textContent=saveTexts()[s]||""; }
function persistLocal(){ try{ localStorage.setItem("nrp-state",JSON.stringify(S)); }catch(e){} }
function scheduleSave(){ persistLocal(); if(!docRef){ setSave("local"); return; } setSave("saving"); clearTimeout(saveTimer); saveTimer=setTimeout(doSave,900); }
async function doSave(){ saveTimer=null; if(saving){again=true;return;} saving=true; const json=JSON.stringify(S);
  try{ await docRef.set({state:JSON.parse(json),updatedAt:Date.now()}); lastJSON=json; setSave("ok"); }
  catch(e){ if(e&&e.code==="invalid_argument"){ setSave("view"); docRef=null; } else setSave("err"); }
  saving=false; if(again){again=false; doSave();} }
function connect(){
  if(!IN_CLAUDE){ setSave("local"); return; }
  window.claude.use("db").then(db=>{
    if(!db){ setSave("local"); return; }
    docRef=db.doc("app/state"); loadTimer=setTimeout(()=>setSave("err"),10000);
    docRef.onSnapshot(snap=>{
      if(!snap.metadata.fromCache) clearTimeout(loadTimer);
      if(!snap.exists){ if(!snap.metadata.fromCache) setSave("ok"); return; }
      const raw=(snap.data()||{}).state||{}, json=JSON.stringify(raw);
      if(saveTimer||saving||json===lastJSON){ if(!saveTimer&&!saving) setSave("ok"); return; }
      const a=document.activeElement; if(a&&a.matches&&a.matches("input,textarea,select")) return;
      lastJSON=json; const before=JSON.stringify(S); S=migrate(raw); persistLocal(); setSave("ok");
      if((raw.v||1)<4) scheduleSave();
      if(before!==JSON.stringify(S)) render(false);
    },()=>{ clearTimeout(loadTimer); setSave("local"); docRef=null; });
  }).catch(()=>setSave("local"));
}

function snapshotForUndo(){ if(!undoArmed) return; undoStack.push(JSON.stringify(S)); if(undoStack.length>40) undoStack.shift(); undoArmed=false; $("#undoBtn").disabled=false; }
function rearmUndo(){ clearTimeout(undoTimer); undoTimer=setTimeout(()=>{undoArmed=true;},1200); }
function mutate(fn,opts={}){ snapshotForUndo(); fn(); rearmUndo(); scheduleSave(); if($(".sheet")&&!opts.noReopen) reopenSoon(); if(opts.render) render(false); else refresh(); }
function undo(){ const prev=undoStack.pop(); if(!prev) return; S=migrate(JSON.parse(prev)); undoArmed=true; scheduleSave(); closeSheet(true); render(false); $("#undoBtn").disabled=!undoStack.length; toast(L("ย้อนกลับแล้ว","Undone")); }

/* ================= charts ================= */
function baseOpts(extra={}){ const muted=cssv("--muted"),line=cssv("--line"),ink=cssv("--ink"),font={family:"IBM Plex Sans Thai"};
  return Object.assign({responsive:true,maintainAspectRatio:false,animation:{duration:450},plugins:{legend:{display:false,labels:{color:ink,font,boxWidth:12}}},scales:{x:{ticks:{color:muted,font},grid:{color:line}},y:{ticks:{color:muted,font},grid:{color:line}}}},extra); }
const kfmt=v=>Math.abs(v)>=1000?fmt(v/1000,0)+"k":fmt(v,0);
function upsert(id,cfg){ const el=document.getElementById(id); if(!el) return; if(typeof Chart==="undefined"){ el.parentNode.innerHTML=`<p class="hint">${L("โหลดกราฟไม่ได้ (ไม่มีอินเทอร์เน็ต)","Charts unavailable offline")}</p>`; return; }
  if(charts[id]&&charts[id].canvas===el){ charts[id].data=cfg.data; charts[id].options=cfg.options; charts[id].update(); return; } if(charts[id]) charts[id].destroy(); charts[id]=new Chart(el,cfg); }
function drawCharts(R){
  const ink=cssv("--ink"),c2=cssv("--c2"),c5=cssv("--c5"),bad=cssv("--bad"),muted=cssv("--muted"),rev=cssv("--rev"),cost=cssv("--cost"),prof=cssv("--prof");
  const labels=R.series.map(m=>monthLabel(m.ym,true));
  if(page==="home"||page==="profit"){ const o=baseOpts(); o.scales.y.ticks.callback=kfmt; o.plugins.tooltip={callbacks:{label:c=>L("เงินสะสม ","Cumulative ")+baht(c.parsed.y)}};
    upsert("chCum",{type:"bar",data:{labels,datasets:[{data:R.series.map(m=>m.cum),backgroundColor:R.series.map(m=>m.cum<0?bad:prof),borderRadius:2}]},options:o}); }
  if(page==="profit"){ const o=baseOpts(); o.scales.y.ticks.callback=kfmt; o.plugins.legend.display=true; o.plugins.tooltip={callbacks:{label:c=>`${c.dataset.label}: ${baht(c.parsed.y)}`}};
    upsert("chMonthly",{type:"bar",data:{labels,datasets:[{label:CAT.rev(),data:R.series.map(m=>m.revenue),backgroundColor:rev,borderRadius:2},{label:CAT.cost(),data:R.series.map(m=>m.cost),backgroundColor:cost,borderRadius:2},{type:"line",label:CAT.prof(),data:R.series.map(m=>m.net),borderColor:prof,backgroundColor:prof,pointRadius:0,borderWidth:2.5}]},options:o}); }
  if(page==="market"){
    const pts=S.refs.filter(r=>r.kind==="rent"&&n(r.price)>0&&refDays(r)).map(r=>({x:refDays(r),y:refPerDay(r),n:r.name}));
    const ours=S.packages.filter(p=>p.on).map(p=>{ const b=bookingOf(p,{}),per=pkgPer(p),d=b.busy/per/Math.max(1,b.units),len=p.kind==="weekly"?(p.leave?spanDays(p.days||[]):1):Math.max(1,n(p.useDays)); return {x:len,y:n(p.price)*n(S.whatIf.price)/100/Math.max(.1,d),n:p.name}; });
    const o=baseOpts(); o.scales.x.type="logarithmic"; o.scales.x.title={display:true,text:L("จำนวนวันที่เช่าต่อครั้ง","Days per rental"),color:muted}; o.scales.x.ticks.callback=v=>[1,2,3,7,14,30].includes(v)?v:"";
    o.scales.y.title={display:true,text:L("บาท / วัน","฿ / day"),color:muted}; o.plugins.legend.display=true; o.plugins.tooltip={callbacks:{label:c=>`${c.raw.n}: ${baht(c.raw.y)}`}};
    upsert("chCurve",{type:"scatter",data:{datasets:[{label:L("คู่แข่ง","Competitors"),data:pts,backgroundColor:c5,pointRadius:6},{label:L("ของเรา","Ours"),data:ours,backgroundColor:ink,pointRadius:7,pointStyle:"rectRot"}]},options:o});
    const ses=S.refs.filter(r=>r.kind==="session"&&n(r.price)>0).map(r=>({n:r.name+(n(r.qty)>1?" (pack)":""),v:refPer30(r),c:r.country==="ไทย"?c2:c5}));
    const ourS=S.packages.filter(p=>p.on).map(p=>({n:L("ของเรา · ","Ours · ")+p.name,v:bookingOf(p,{}).perAthlete||0,c:ink})).filter(x=>x.v>0);
    const all=[...ses,...ourS].sort((a,b)=>b.v-a.v); const o2=baseOpts({indexAxis:"y"}); o2.scales.x.ticks.callback=v=>fmt(v,0); o2.scales.y.ticks.autoSkip=false; o2.scales.y.ticks.font={size:11}; o2.plugins.tooltip={callbacks:{label:c=>baht(c.parsed.x)}};
    upsert("chSes",{type:"bar",data:{labels:all.map(x=>x.n),datasets:[{data:all.map(x=>x.v),backgroundColor:all.map(x=>x.c),borderRadius:3}]},options:o2});
  }
}

}
function refresh(){ const R=compute(); drawCharts(R); return R; }
function render(animate){
  chrome();
  const R=compute();
  Object.keys(charts).forEach(k=>{charts[k].destroy(); delete charts[k];});
  const html=({home:pHome,revenue:pRevenue,costs:pCosts,profit:pProfit,calendar:pCalendar,sheet:pSheet,market:pMarket,config:pConfig}[page]||pHome)(R);
  const app=$("#app"), sy=window.scrollY; app.innerHTML=html;
  const v=$(".view",app); if(animate&&v){ $$(":scope > *",v).forEach((el,i)=>el.style.setProperty("--i",Math.min(i,8))); v.classList.add("enter"); }
  drawCharts(R);
  if(animate) window.scrollTo(0,0); else window.scrollTo(0,sy);
  const fi=$("#importFile"); if(fi) fi.addEventListener("change",importFile);
}
function go(k){
  if(!PAGES.some(p=>p.k===k)) k="home";
  closeSheet(true);
  if(k===page&&$("#app").children.length){ render(false); window.scrollTo({top:0,behavior:"smooth"}); return; }
  page=k; try{ history.replaceState(null,"","#"+k); }catch(e){}
  const doit=()=>render(true);
  if(document.startViewTransition&&!matchMedia("(prefers-reduced-motion: reduce)").matches){ try{ const vt=document.startViewTransition(doit); [vt.ready,vt.finished,vt.updateCallbackDone].forEach(p=>p&&p.catch(()=>{})); }catch(e){ doit(); } } else doit();
}
function setLang(l){ LANG=l==="en"?"en":"th"; try{ localStorage.setItem("nrp-lang",LANG); }catch(e){} render(false); if($(".sheet")) reopenSheet(); }

const loaded={};
function loadScript(src){ if(loaded[src]) return loaded[src]; return loaded[src]=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>{delete loaded[src]; rej(new Error("load"));}; document.head.appendChild(s); }); }
async function saveFile(blob,name){
  if(IN_CLAUDE){ try{ const d=await window.claude.use("downloads"); if(d){ await d.save({filename:name,data:blob}); toast(L("บันทึกไฟล์แล้ว","File saved")); return; } }catch(e){ if(e&&e.code==="declined") return; toast(L("บันทึกไฟล์ไม่ได้ในหน้านี้","Can't save files here")); return; } }
  const url=URL.createObjectURL(blob),a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast(L("บันทึก ","Saved ")+name);
}
async function sheetCanvas(){ await loadScript(LIBS.h2c); return window.html2canvas($("#pl"),{scale:2,backgroundColor:S.sheet.dark?"#0b0b0c":"#ffffff",useCORS:true,logging:false}); }
const stamp=()=>new Date().toISOString().slice(0,10);

  plData().forEach(({k,items})=>items.forEach(it=>rows.push([kL(k),it.p.name,it.price,kU(k),schedText(it.p),it.per!=null?Math.round(it.per):"",it.save!=null?Math.round(it.save*100)+"%":"",pkgDesc(it.p)]))); return rows; }
async function exportAs(f){
  try{
    if(f==="png"){ toast(L("กำลังสร้างรูป…","Rendering…")); const c=await sheetCanvas(); c.toBlob(b=>saveFile(b,`Normatec-PriceList-${stamp()}.png`),"image/png"); }
    else if(f==="share"){ toast(L("กำลังเตรียมรูป…","Preparing…")); const c=await sheetCanvas(); c.toBlob(async b=>{ const file=new File([b],`Normatec-PriceList-${stamp()}.png`,{type:"image/png"}); if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:"Normatec"}); }catch(e){} } else saveFile(b,file.name); },"image/png"); }
    else if(f==="pdf"){ toast(L("กำลังสร้าง PDF…","Building PDF…")); const c=await sheetCanvas(); await loadScript(LIBS.pdf); const {jsPDF}=window.jspdf, doc=new jsPDF({unit:"pt",format:"a4"});
      const W=doc.internal.pageSize.getWidth(),Hh=doc.internal.pageSize.getHeight(),m=24,w=W-m*2,h=c.height*w/c.width,pageH=Hh-m*2; let y=0;
      while(y<h){ if(y>0) doc.addPage(); const sliceH=Math.min(pageH,h-y),sc=c.width/w,part=document.createElement("canvas"); part.width=c.width; part.height=Math.ceil(sliceH*sc); part.getContext("2d").drawImage(c,0,Math.floor(y*sc),c.width,part.height,0,0,c.width,part.height); doc.addImage(part.toDataURL("image/jpeg",.92),"JPEG",m,m,w,sliceH); y+=pageH; }
      saveFile(doc.output("blob"),`Normatec-PriceList-${stamp()}.pdf`); }
    else if(f==="csv"){ const csv=tableRows().map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n"); saveFile(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}),`Normatec-PriceList-${stamp()}.csv`); }
    else if(f==="xlsx"||f==="planxlsx"){ toast(L("กำลังสร้าง Excel…","Building Excel…")); await loadScript(LIBS.xlsx); const X=window.XLSX,wb=X.utils.book_new(),R=compute();
      X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([[`Normatec · ${L("ราคา ณ","prices as of")} ${todayTxt()}`],[],...tableRows()]),L("ใบราคา","Price list"));
      X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([[L("ทีม","Team"),L("สถานะ","Status"),L("แพ็กเกจ","Package"),L("วัน","Days"),L("เครื่อง","Units"),L("กม.","km"),L("รายได้/เดือน","Revenue/mo"),L("ค่าส่ง/เดือน","Delivery/mo"),L("เที่ยว/เดือน","Trips/mo")],...S.clubs.map(c=>{ const p=pkgById(c.packageId),z=sumB(clubBookings(c)); return [c.name,sL(c.status),p?p.name:"",p&&p.kind==="weekly"?daysTxt(c.days):"",c.units,c.km,Math.round(z.revenue),Math.round(z.variable),+z.trips.toFixed(1)]; })]),L("สโมสร","Clubs"));
      X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([[L("เดือน","Month"),CAT.rev(),CAT.cost(),CAT.prof(),L("เงินสะสม","Cumulative")],...R.series.map(m=>[monthLabel(m.ym,true),Math.round(m.revenue),Math.round(m.cost),Math.round(m.net),Math.round(m.cum)])]),L("กำไรรายเดือน","Monthly P&L"));
      X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet([[L("ผู้ให้บริการ","Provider"),L("รายการ","Item"),L("ประเภท","Type"),L("ประเทศ","Country"),L("ราคา","Price"),L("สกุล","Currency"),L("จำนวน","Qty"),L("หน่วย","Unit"),L("บาท/วัน","THB/day"),L("บาท/30น.","THB/30min"),L("ลิงก์","Link")],...S.refs.map(r=>[r.name,r.item||"",rkL(r.kind),r.country,n(r.price),r.currency,n(r.qty),uL(r.unit),refPerDay(r)?Math.round(refPerDay(r)):"",refPer30(r)?Math.round(refPer30(r)):"",r.url||""])]),L("ข้อมูลตลาด","Market"));
      const buf=X.write(wb,{bookType:"xlsx",type:"array"}); saveFile(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),`Normatec-${f==="planxlsx"?"Plan":"PriceList"}-${stamp()}.xlsx`); }
    else if(f==="json") saveFile(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),`normatec-backup-${stamp()}.json`);
  }catch(e){ toast(L("ทำไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่","Failed. Check your connection and retry")); }
}
function importFile(e){ const f=e.target.files&&e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ snapshotForUndo(); S=migrate(JSON.parse(rd.result)); undoArmed=true; scheduleSave(); render(false); toast(L("นำเข้าแล้ว","Imported")); }catch(err){ toast(L("ไฟล์ไม่ถูกต้อง","Invalid file")); } }; rd.readAsText(f); }
async function b64encode(str){ const bytes=new TextEncoder().encode(str); let data=bytes; if(window.CompressionStream) data=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()); let s=""; data.forEach(b=>s+=String.fromCharCode(b)); return (window.CompressionStream?"z":"p")+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function b64decode(t){ const mode=t[0],b=t.slice(1).replace(/-/g,"+").replace(/_/g,"/"),arr=Uint8Array.from(atob(b),c=>c.charCodeAt(0)); if(mode==="z") return new TextDecoder().decode(await new Response(new Blob([arr]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()); return new TextDecoder().decode(arr); }
async function shareLink(){ const url=location.href.split("#")[0]+"#import="+await b64encode(JSON.stringify(S)); if(navigator.share){ try{ await navigator.share({title:"Normatec Planner",url}); return; }catch(e){} } const box=$("#linkBox"); box.hidden=false; box.value=url; try{ await navigator.clipboard.writeText(url); toast(L("คัดลอกลิงก์แล้ว","Link copied")); }catch(e){ box.select(); } }
async function checkImportHash(){ const h=location.hash; if(!h.startsWith("#import=")) return;
  try{ const x=JSON.parse(await b64decode(h.slice(8))); window.__pendingImport=x; openSheet(L("นำเข้าข้อมูลจากลิงก์","Import from link"),`<p>${L("แทนที่ข้อมูลในเครื่องนี้ด้วยข้อมูลจากลิงก์?","Replace the data on this device with the linked data?")} (${(x.clubs||[]).length} ${L("ทีม","teams")})</p>`,`<button class="btn ghost sm" data-act="closeSheet">${L("ไม่ใช่ตอนนี้","Not now")}</button><button class="btn sm" data-act="confirmImport">${L("แทนที่","Replace")}</button>`); }
  catch(e){ toast(L("ลิงก์ไม่สมบูรณ์","Broken link")); } try{ history.replaceState(null,"","#"+page); }catch(e){} }

/* ================= events ================= */
function applyInput(el){
  const k=el.dataset.k; if(!k) return false;
  let v=el.dataset.t==="bool"?el.value==="true":el.dataset.t==="n"?(el.value===""?0:Number(el.value)):el.value;
  if(el.dataset.t==="n"&&!isFinite(v)) return false;
  setPath(S,k,v);
  const m=k.match(/^clubs\.(\d+)\.packageId$/); if(m){ const c=S.clubs[+m[1]],p=pkgById(v); if(p){ if(p.kind==="weekly") c.days=[...(p.days||[])]; c.units=n(p.units)||1; } }
  return true;
}
function setAllPrices(mode){ const R=compute(); mutate(()=>S.packages.forEach(p=>{ const sg=suggestFor(p,R); p.price=mode==="cost"?sg.byCost:sg.value; }),{render:true}); toast(L("ปรับราคาแล้ว · กดย้อนกลับได้","Prices updated · Undo available")); }
document.addEventListener("click",e=>{
  if(e.target.closest("[data-stop]")) return;
  const sc=e.target.closest("[data-scroll]"); if(sc){ e.preventDefault(); const t=document.getElementById(sc.dataset.scroll); t&&t.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const t=e.target.closest("[data-go],[data-act]"); if(!t||t.tagName==="SELECT"||t.tagName==="INPUT") return;
  if(t.dataset.go){ go(t.dataset.go); return; }
  const a=t.dataset.act, i=+t.dataset.i;
  switch(a){
    case "inc": case "dec": { const box=t.closest(".stepper"),inp=$("input",box),k=box.dataset.k,cur=n(getPath(S,k)),step=box.dataset.step==="auto"?priceStep(cur):n(box.dataset.step)||1;
      let v=a==="inc"?cur+step:cur-step; v=Math.max(n(box.dataset.min),Math.round(v*100)/100); if(box.dataset.max!=null) v=Math.min(n(box.dataset.max),v);
      inp.value=v; inp.classList.remove("flash"); void inp.offsetWidth; inp.classList.add("flash"); mutate(()=>setPath(S,k,v),{render:!$(".sheet")}); break; }
    case "openPackage": openPackage(t.dataset.id); break;
    case "openClub": openClub(t.dataset.id); break;
    case "openDay": { const d=t.dataset.d; calMonth=d.slice(0,7); calDay=d; flt.calClub="all"; if(page==="calendar"){ closeSheet(true); render(false); } else go("calendar"); setTimeout(()=>{ const c=$("#dayCard"); c&&c.scrollIntoView({behavior:"smooth",block:"start"}); },120); break; }
    case "pickDay": calDay=t.dataset.d; render(false); setTimeout(()=>{ const c=$("#dayCard"); c&&c.scrollIntoView({behavior:"smooth",block:"nearest"}); },50); break;
    case "calShift": calMonth=addMonths(calMonthKey(),n(t.dataset.d)); calDay=null; render(false); break;
    case "calForClub": flt.calClub=t.dataset.id; closeSheet(true); if(page==="calendar") render(false); else go("calendar"); break;
    case "applyAll": setAllPrices(t.dataset.mode); break;
    case "addPackage": openSheet(L("เพิ่มแพ็กเกจ","Add package"),`<div class="f"><label for="nk">${L("รูปแบบ","Type")}</label><select id="nk">${Object.keys(KINDS).map(k=>`<option value="${k}">${kL(k)} — ${kD(k)}</option>`).join("")}</select></div>`,`<button class="btn sm" data-act="addPackageKind">${L("สร้าง","Create")}</button>`); break;
    case "addPackageKind": { const k=$("#nk").value, base={weekly:{name:"New weekly package",price:2990,days:[2,4],leave:false,athletes:8},match:{name:"New match package",price:690,useDays:1,athletes:11},event:{name:"New tournament package",price:1690,useDays:3,athletes:10},personal:{name:"New individual rental",price:490,useDays:1,athletes:1,qty:2}}[k], id=uid("k");
      mutate(()=>S.packages.push(Object.assign({id,on:true,kind:k,units:1,desc:"",descEn:""},base)),{noReopen:true}); closeSheet(true); page="revenue"; render(false); setTimeout(()=>openPackage(id),300); break; }
    case "dupPackage": mutate(()=>{ const c=clone(S.packages[i]); c.id=uid("k"); c.name+=" (copy)"; S.packages.splice(i+1,0,c); },{noReopen:true,render:true}); closeSheet(true); break;
    case "delPackage": mutate(()=>S.packages.splice(i,1),{noReopen:true,render:true}); closeSheet(true); toast(L("ลบแล้ว · กดย้อนกลับได้","Deleted · Undo available")); break;
    case "delClub": mutate(()=>S.clubs.splice(i,1),{noReopen:true,render:true}); closeSheet(true); toast(L("ลบแล้ว · กดย้อนกลับได้","Deleted · Undo available")); break;
    case "delItem": mutate(()=>S[t.dataset.list].splice(i,1),{noReopen:true,render:true}); closeSheet(true); break;
    case "del": mutate(()=>S[t.dataset.list].splice(i,1),{render:true}); break;
    case "addRow": mutate(()=>S[t.dataset.list].push({name:L("รายการใหม่","New item"),amount:0}),{render:true}); break;
    case "addClub": { const id=uid("c"); mutate(()=>S.clubs.unshift(normClub({id,name:L("ทีมใหม่","New team"),type:"ฟุตบอล",group:"จุฬาฯ",status:"contact",packageId:"k1",days:[...((pkgById("k1")||{}).days||[1,3,5])],km:2})),{render:true,noReopen:true}); openClub(id); break; }
    case "addRef": { mutate(()=>S.refs.unshift({id:uid("r"),name:L("แหล่งใหม่","New source"),item:"",kind:"rent",country:"ไทย",price:0,currency:"THB",qty:1,unit:"day",minutes:30,inAvg:false,bench:true,url:"",note:"",date:stamp()}),{render:true,noReopen:true}); editRef(0); break; }
    case "editRef": editRef(i); break;
    case "machines": mutate(()=>S.machine.count=Math.max(1,n(S.machine.count)+n(t.dataset.d)),{render:true}); break;
    case "sheetText": openSheet(L("ข้อความในใบราคา","Price list text"),`${field("sheet.title",L("หัวข้อ","Title"),{type:"text",wide:true})}${field(LANG==="en"?"sheet.subEn":"sheet.sub",L("คำอธิบายสั้น","Subtitle"),{type:"text",wide:true})}${field("sheet.contact",L("ช่องทางติดต่อ","Contact"),{type:"text",wide:true})}${field("sheet.phone",L("เบอร์โทร / IG","Phone / IG"),{type:"text",wide:true})}`,`<button class="btn sm" data-act="closeSheet">${L("เสร็จ","Done")}</button>`,()=>render(false)); break;
    case "exp": exportAs(t.dataset.f); break;
    case "print": window.print(); break;
    case "moreMenu": openSheet(L("เมนู","Menu"),`<div class="tpl">${PAGES.map(p=>`<button data-go="${p.k}"><b>${pL(p)}</b></button>`).join("")}</div>`); break;
    case "closeSheet": closeSheet(); break;
    case "shareLink": shareLink(); break;
    case "confirmImport": snapshotForUndo(); S=migrate(window.__pendingImport); undoArmed=true; scheduleSave(); closeSheet(true); render(false); break;
    case "install": if(window.__bip){ window.__bip.prompt(); window.__bip=null; t.hidden=true; } break;
    case "askReset": $("#resetConfirm").hidden=false; break;
    case "cancelReset": $("#resetConfirm").hidden=true; break;
    case "doReset": mutate(()=>{ const keep={clubs:S.clubs,refs:S.refs}; S=Object.assign(clone(DEFAULT),keep); },{render:true}); break;
  }
});
document.addEventListener("toggle",e=>{ const d=e.target; if(d.matches&&d.matches("details.dd")){ if(d.open) openDD=d.dataset.dd; else if(openDD===d.dataset.dd) openDD=null; } },true);
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"&&!e.shiftKey&&!(e.target.matches&&e.target.matches("input[type=text],input[type=url],textarea"))){ e.preventDefault(); undo(); }
  if(e.key==="Escape") closeSheet();
  if(e.key==="Enter"&&e.target.matches&&e.target.matches('[role="button"]')) e.target.click();
});
document.addEventListener("input",e=>{
  const el=e.target; if(!el.dataset||!el.dataset.k||el.tagName==="SELECT"||el.type==="checkbox"||el.type==="radio"||el.type==="file"||el.type==="date") return;
  snapshotForUndo(); if(applyInput(el)){ rearmUndo(); scheduleSave(); refresh(); }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="langSel"||el.dataset.lang){ setLang(el.value); return; }
  if(el.dataset.flt){ flt[el.dataset.flt]=el.value; render(false); return; }
  if(el.dataset.cal==="month"){ calMonth=el.value; calDay=null; render(false); return; }
  if(el.id==="allPriceSel"&&el.value){ setAllPrices(el.value); return; }
  if(el.dataset.actSelect==="setPrice"){ if(el.value){ const i=+el.dataset.i; mutate(()=>S.packages[i].price=n(el.value)); toast(L("ตั้งราคาแล้ว","Price set")); } return; }
  if(el.dataset.act==="toggleDay"){ const k=el.dataset.k,d=n(el.dataset.d); openDD=k; mutate(()=>{ const arr=(getPath(S,k)||[]).slice(); const j=arr.indexOf(d); if(j>=0) arr.splice(j,1); else arr.push(d); setPath(S,k,arr); },{render:!$(".sheet")}); return; }
  if(el.dataset.act==="setDays"){ const k=el.dataset.k; openDD=null; mutate(()=>setPath(S,k,el.dataset.v.split(",").map(Number)),{render:!$(".sheet")}); return; }
  if(el.dataset.act==="sheetToggle"){ const id=el.dataset.id; openDD="sheetpk"; mutate(()=>{ const h=S.sheet.hidden||(S.sheet.hidden=[]); const j=h.indexOf(id); j>=0?h.splice(j,1):h.push(id); },{render:true}); return; }
  if(!el.dataset||!el.dataset.k) return;
  snapshotForUndo();
  if(applyInput(el)){ rearmUndo(); scheduleSave();
    if($(".sheet")){ if(el.tagName==="SELECT"||el.type==="date"||el.dataset.t==="n") reopenSheet(); refresh(); }
    else render(false); }
});
$("#undoBtn").addEventListener("click",undo);
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(h.startsWith("import=")) checkImportHash(); else if(h&&h!==page&&PAGES.some(p=>p.k===h)) go(h); });
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render(false)); }catch(e){}
new MutationObserver(()=>render(false)).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
function isStandalone(){ return matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true; }
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); window.__bip=e; const b=$("#installBtn"); if(b) b.hidden=false; });

/* ================= boot ================= */
if(isStandalone()) document.documentElement.classList.add("standalone");
const h0=location.hash.slice(1); page=PAGES.some(p=>p.k===h0)?h0:"home";
render(true); connect(); checkImportHash();
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{ const w=reg.installing; w&&w.addEventListener("statechange",()=>{ if(w.state==="installed" && navigator.serviceWorker.controller) toast("มีเวอร์ชันใหม่ · ปิดแล้วเปิดแอปอีกครั้งเพื่ออัปเดต"); }); });
  }).catch(()=>{}));
}
})();
