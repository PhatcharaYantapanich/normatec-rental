<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{--sat:env(safe-area-inset-top,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Normatec Rental Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="วางแผนธุรกิจให้เช่าเครื่อง Normatec: ตั้งราคา ใบราคา ลูกค้า ต้นทุน และคืนทุน">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Normatec">
<meta name="application-name" content="Normatec">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: Hyperice-style black header band, desktop top tabs / phone bottom tab bar, single-column cards. Monochrome CI with one blue data accent. */
:root{
  --bg:#ffffff; --surface:#f4f4f2; --surface-2:#e9e9e6; --ink:#0b0b0c; --muted:#5f6267; --line:#e2e2df;
  --bar:#0b0b0c; --bar-ink:#ffffff; --btn:#0b0b0c; --btn-ink:#ffffff; --sheet:#ffffff; --scrim:rgba(0,0,0,.45);
  --c1:#0b0b0c; --c2:#3a6ff7; --c3:#17907d; --c4:#d99410; --c5:#a3a8ad;
  --good:#16834a; --warn:#b26a00; --bad:#c62828; --good-bg:#e5f3ea; --warn-bg:#fcf0dc; --bad-bg:#fbe6e6;
  --display:"Kanit","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans Thai","Helvetica Neue",Arial,sans-serif;
  --r:6px; --pill:999px; --ease:cubic-bezier(.2,.8,.2,1);
  --navh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --surface:#161618; --surface-2:#232326; --ink:#f3f3f1; --muted:#a6a9ae; --line:#2c2c30;
  --bar:#000000; --bar-ink:#ffffff; --btn:#f3f3f1; --btn-ink:#0b0b0c; --sheet:#161618; --scrim:rgba(0,0,0,.6);
  --c1:#f3f3f1; --c2:#7097ff; --c3:#3cc3ac; --c4:#f2b940; --c5:#6f7479;
  --good:#4cc47f; --warn:#f0a63a; --bad:#ff6b6b; --good-bg:#11301e; --warn-bg:#33240d; --bad-bg:#3a1515;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --surface:#161618; --surface-2:#232326; --ink:#f3f3f1; --muted:#a6a9ae; --line:#2c2c30;
  --bar:#000000; --bar-ink:#ffffff; --btn:#f3f3f1; --btn-ink:#0b0b0c; --sheet:#161618; --scrim:rgba(0,0,0,.6);
  --c1:#f3f3f1; --c2:#7097ff; --c3:#3cc3ac; --c4:#f2b940; --c5:#6f7479;
  --good:#4cc47f; --warn:#f0a63a; --bad:#ff6b6b; --good-bg:#11301e; --warn-bg:#33240d; --bad-bg:#3a1515;
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bar)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
a{color:var(--c2)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c2);outline-offset:2px}

/* header */
.topbar{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;z-index:30;padding-top:var(--sat,0px)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:15px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-mark{display:grid;gap:3px;width:18px}
.brand-mark i{display:block;height:4px;border-radius:4px;background:#fff}
.brand-mark i:nth-child(2){width:84%;margin:0 auto}.brand-mark i:nth-child(3){width:68%;margin:0 auto}
.topnav{display:flex;gap:2px;margin-left:12px;overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav button{background:none;border:0;color:rgba(255,255,255,.62);font-family:var(--display);font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;padding:18px 10px 16px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.topnav button:hover{color:#fff}
.topnav button[aria-current="page"]{color:#fff;border-bottom-color:#fff}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:var(--pill);padding:6px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn:disabled{opacity:.35;cursor:default}
.hbtn svg{width:15px;height:15px}
.save-dot{width:8px;height:8px;border-radius:50%;background:#4cc47f;display:inline-block}
.save-dot[data-s="saving"]{background:#f0a63a}.save-dot[data-s="err"]{background:#ff6b6b}.save-dot[data-s="local"]{background:#9aa0a6}

/* bottom nav (phones) */
.botnav{display:none}
@media (max-width:760px){
  .topnav{display:none}
  .botnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .botnav button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:8px 2px 6px;font-size:11px;color:var(--muted);cursor:pointer;min-height:var(--navh)}
  .botnav svg{width:22px;height:22px}
  .botnav button[aria-current="page"]{color:var(--ink)}
  .botnav button[aria-current="page"] svg{transform:translateY(-1px)}
  main{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 24px)!important}
  .hide-sm{display:none!important}
}

main{padding-block:24px 64px}
.view{display:grid;gap:22px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.page-title{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.page-title h1{font-size:clamp(26px,5vw,40px);text-transform:uppercase;line-height:1.05;margin-top:4px}
.lead{color:var(--muted);max-width:62ch;margin:6px 0 0;font-size:14.5px}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes flash{0%{background:var(--surface-2)}100%{background:transparent}}
.view.enter > *{animation:rise .42s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
.pop{animation:pop .28s var(--ease)}
::view-transition-old(main-view){animation:vt-out .16s ease-in both}
::view-transition-new(main-view){animation:vt-in .32s var(--ease) both}
@keyframes vt-out{to{opacity:0;transform:translateY(-6px)}}
@keyframes vt-in{from{opacity:0;transform:translateY(10px)}}
#app{view-transition-name:main-view}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* buttons */
.btn{appearance:none;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);font-family:var(--display);font-weight:500;letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:11px 18px;border-radius:var(--pill);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:7px 13px;font-size:12px}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--line)}
.btn svg{width:16px;height:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--pill);padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,transform .12s}
.chip:active{transform:scale(.96)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.soft{background:var(--surface);border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scroll-x{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroll-x::-webkit-scrollbar{display:none}

/* cards */
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.card.flat{background:var(--surface);border-color:transparent}
.card h3{font-size:16px;text-transform:uppercase;letter-spacing:.05em}
.hint{font-size:13px;color:var(--muted);margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}

/* summary */
.verdict{background:var(--bar);color:var(--bar-ink);border-radius:var(--r);padding:24px;display:grid;gap:14px}
.verdict .sentence{font-family:var(--display);font-size:clamp(20px,3.4vw,30px);line-height:1.3;font-weight:500}
.verdict .sentence b{font-weight:700}
.verdict .light{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:5px 12px;border-radius:var(--pill);background:rgba(255,255,255,.1);width:max-content}
.verdict .light i{width:10px;height:10px;border-radius:50%;display:inline-block}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bigstat{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:2px;min-width:0}
.bigstat .l{font-size:13px;color:var(--muted)}
.bigstat .v{font-family:var(--display);font-size:clamp(22px,4vw,34px);font-weight:600;line-height:1.15}
.bigstat .s{font-size:12.5px;color:var(--muted)}
@media (max-width:560px){.big3{grid-template-columns:1fr}.bigstat{grid-template-columns:1fr auto;align-items:baseline}.bigstat .s{grid-column:1/-1}}
.hbar{display:grid;gap:10px}
.hbar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.hbar-row .t{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-row .v{font-size:14px;font-weight:600}
.hbar-track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.hbar-fill{height:100%;border-radius:8px;transition:width .5s var(--ease)}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px 14px;background:var(--surface);border-radius:var(--r);font-size:14px}
.todo .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
.ic.good{background:var(--good-bg);color:var(--good)}.ic.warn{background:var(--warn-bg);color:var(--warn)}.ic.bad{background:var(--bad-bg);color:var(--bad)}.ic.info{background:var(--surface-2);color:var(--ink)}
.todo .act{margin-top:6px}

/* sliders */
.slider{display:grid;gap:6px}
.slider .top{display:flex;justify-content:space-between;font-size:14px}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}

/* pricing studio */
.prog{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;background:var(--bg);transition:opacity .2s}
.prog.off{opacity:.5}
.prog-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.prog-name{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.25;min-width:0}
.prog-desc{font-size:13px;color:var(--muted);margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;border-radius:var(--pill);padding:3px 10px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tag.good{background:var(--good-bg);color:var(--good)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.stepper{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;border:1px solid var(--line);border-radius:var(--pill);overflow:hidden;height:48px;background:var(--bg)}
.stepper button{height:100%;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--ink)}
.stepper button:active{background:var(--surface)}
.stepper input{border:0;background:transparent;text-align:center;font-family:var(--display);font-size:20px;font-weight:600;width:100%;min-width:0;color:var(--ink);padding:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper.sm{height:40px;grid-template-columns:38px minmax(0,1fr) 38px}
.stepper.sm input{font-size:16px}
.field-lab{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:block}
.prog-controls{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
@media (max-width:420px){.prog-controls{grid-template-columns:1fr}}
.meter{position:relative;height:38px;margin-top:4px}
.meter .rail{position:absolute;left:0;right:0;top:14px;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--bad-bg) 0%,var(--bad-bg) var(--floor),var(--good-bg) var(--floor),var(--good-bg) var(--mkt),var(--warn-bg) var(--mkt),var(--warn-bg) 100%)}
.meter .mk{position:absolute;top:6px;width:2px;height:24px;background:var(--muted);transform:translateX(-1px)}
.meter .mk span{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap}
.meter .me{position:absolute;top:8px;width:20px;height:20px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--ink);transform:translateX(-10px);transition:left .35s var(--ease)}
.facts-row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.facts-row b{color:var(--ink);font-weight:600}
.result-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.result-row b{font-family:var(--display);font-weight:600;font-size:17px}
.flash{animation:flash .6s ease-out}

/* lists */
.rows{display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;background:var(--bg);cursor:pointer;transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface)}
.row .t{font-weight:600;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.row .r{text-align:right;font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap}
.row .rs{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:flex;height:14px;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.seg span{display:block;height:100%;transition:width .5s var(--ease)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* forms in sheets */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .wide{grid-column:1/-1}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:12.5px;color:var(--muted)}
.f .help{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=url],input[type=number].plain,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;font:inherit;font-size:16px}
textarea{min-height:80px;font-size:13px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}

/* sheet (modal) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .25s}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:51;left:50%;bottom:0;width:min(640px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);background:var(--sheet);border-radius:14px 14px 0 0;
  transform:translate(-50%,100%);transition:transform .34s var(--ease);display:grid;grid-template-rows:auto minmax(0,1fr) auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.show{transform:translate(-50%,0)}
@media (min-width:761px){.sheet{bottom:auto;top:50%;border-radius:14px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .3s var(--ease),opacity .2s}.sheet.show{transform:translate(-50%,-50%);opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-size:16px;text-transform:uppercase;letter-spacing:.05em}
.sheet-body{overflow:auto;padding:18px;display:grid;gap:16px;align-content:start}
.sheet-foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:18px;line-height:1}
.tpl{display:grid;gap:10px}
.tpl button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:14px;cursor:pointer;display:grid;gap:2px}
.tpl button:hover{border-color:var(--ink)}
.tpl b{font-family:var(--display);font-size:16px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 16px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--pill);font-size:14px;z-index:60;opacity:0;transition:all .3s var(--ease);pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:761px){.toast{bottom:24px}}

/* price list sheet (customer facing) */
.pl-wrap{overflow-x:auto;padding:4px}
.pl{width:760px;margin:0 auto;background:#ffffff;color:#0b0b0c;font-family:var(--body);border:1px solid #e2e2df}
.pl.story{width:540px}
.pl.dark{background:#0b0b0c;color:#f3f3f1;border-color:#2c2c30}
.pl-head{background:#0b0b0c;color:#fff;padding:34px 36px 28px;display:grid;gap:10px}
.pl.dark .pl-head{background:#000;border-bottom:1px solid #2c2c30}
.pl-brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:700;letter-spacing:.24em;font-size:14px;text-transform:uppercase}
.pl-title{font-family:var(--display);font-size:40px;font-weight:700;text-transform:uppercase;line-height:1.02}
.pl-sub{font-size:14px;opacity:.75}
.pl-date{font-size:12px;opacity:.6;letter-spacing:.06em}
.pl-body{padding:26px 36px 8px;display:grid;gap:26px}
.pl-group h4{font-family:var(--display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin:0 0 6px;padding-bottom:8px;border-bottom:2px solid currentColor;display:flex;justify-content:space-between}
.pl-group h4 span{font-family:var(--body);letter-spacing:0;text-transform:none;font-weight:400;opacity:.6;font-size:12px}
.pl-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:12px 0;border-bottom:1px solid rgba(127,127,127,.25)}
.pl-item:last-child{border-bottom:0}
.pl-item .n{font-family:var(--display);font-weight:600;font-size:18px}
.pl-item .d{font-size:13px;opacity:.7;grid-column:1}
.pl-item .p{font-family:var(--display);font-weight:600;font-size:24px;text-align:right;white-space:nowrap;grid-row:1/3;grid-column:2;align-self:center}
.pl-item .p small{font-family:var(--body);font-size:12px;font-weight:400;opacity:.65;display:block;text-align:right}
.pl-item .save{grid-column:1;font-size:12px;margin-top:2px}
.pl-item .save b{background:#0b0b0c;color:#fff;border-radius:999px;padding:1px 8px;font-weight:500}
.pl.dark .pl-item .save b{background:#f3f3f1;color:#0b0b0c}
.pl-cond{padding:8px 36px 22px;font-size:12px;opacity:.75;display:grid;gap:4px}
.pl-cond b{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:12px}
.pl-foot{background:#0b0b0c;color:#fff;padding:18px 36px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
.pl.dark .pl-foot{background:#000;border-top:1px solid #2c2c30}
.pl.story .pl-title{font-size:34px}
.pl.story .pl-head,.pl.story .pl-body,.pl.story .pl-cond,.pl.story .pl-foot{padding-left:26px;padding-right:26px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}

.chart{position:relative;height:260px;min-width:0}
.chart.tall{height:320px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r);background:var(--surface);font-size:14px}
.banner.blue{background:var(--c2);color:#fff}
.banner.blue .btn{background:#fff;color:#0b0b0c;border-color:#fff}
.banner.blue .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.footer{padding-block:18px 28px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
@media (max-width:760px){.footer{display:none}}

@media print{
  body *{visibility:hidden}
  #pl, #pl *{visibility:visible}
  #pl{position:absolute;left:0;top:0;border:0}
  body::before,.topbar,.botnav{display:none}
}

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n = v => { const x = Number(v); return isFinite(x) ? x : 0; };
const fmt = (v,d=0) => (isFinite(v)?Number(v):0).toLocaleString("th-TH",{maximumFractionDigits:d});
const baht = v => (v<0?"-":"") + "฿" + fmt(Math.abs(Math.round(v)));
const pct = v => fmt(v*100,0) + "%";
const monthsTxt = v => v==null||!isFinite(v) ? "ยังไม่คืนทุน" : v<1 ? "ไม่ถึง 1 เดือน" : fmt(v,1)+" เดือน";
const uid = p => p + Math.random().toString(36).slice(2,8);
const cssv = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888";
const getPath = (o,p) => p.split(".").reduce((a,k)=>a==null?a:a[k], o);
function setPath(o,p,v){ const ks=p.split("."); let t=o; for(let i=0;i<ks.length-1;i++){ t=t[ks[i]]; if(t==null) return; } t[ks[ks.length-1]]=v; }
const progById = id => S.programs.find(p=>p.id===id);
const median = a => { if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
function nicePrice(x){
  if(!(x>0)) return 0;
  if(x<100) return Math.max(10, Math.round(x/10)*10);
  const step = x<1000?50 : x<5000?100 : 500;
  const v = Math.ceil(x/step)*step;
  return v-10 > x*0.9 ? v-10 : v;
}
const priceStep = p => p<1000?10 : p<5000?50 : 100;
const todayTH = () => new Date().toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"});
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2200); }

/* ================= model ================= */
function machineDays(p){ const m=S.machine; return p.useType==="sessions" ? n(p.use)*n(m.sessionMin)/Math.max(1,n(m.openHours)*60) : n(p.use); }
function usesOf(p){ return p.useType==="sessions" ? n(p.use) : n(p.uses); }
function varUnit(p){
  const o=S.ops;
  return n(p.handovers)*(n(o.cleaning) + n(o.deliveryShare)/100*2*n(o.tripCost)) + (p.useType==="sessions" ? n(p.use)*n(o.consumable) : 0);
}
const clubSeats = pid => S.clubs.filter(c=>c.status==="won" && c.programId===pid).reduce((a,c)=>a+n(c.seats),0);
const refTHB = r => n(r.price)*n(S.fx[r.currency]||1);
const refDays = r => UNIT_DAYS[r.unit] ? Math.max(1,n(r.qty))*UNIT_DAYS[r.unit] : null;
const refPerDay = r => refDays(r) ? refTHB(r)/refDays(r) : null;
const refPer30 = r => r.unit==="session" ? refTHB(r)/Math.max(1,n(r.qty))/Math.max(1,n(r.minutes)||30)*30 : null;
function clinicAvg(){
  if(n(S.value.clinicPrice)>0) return n(S.value.clinicPrice);
  const xs = S.refs.filter(r=>r.kind==="session" && r.inAvg && n(r.price)>0).map(refPer30).filter(Boolean);
  return xs.length ? avg(xs) : 1250;
}
function rentalLen(p){
  if(p.useType!=="days") return 0;
  const per = n(p.handovers)>=1 ? n(p.use)/n(p.handovers) : n(p.use);
  return Math.max(1, Math.floor(per));
}
/* market benchmark for one program, with the references it used */
function marketFor(p){
  if(p.useType==="sessions"){
    if(n(p.use)>1){
      const packs = S.refs.filter(r=>r.kind==="session" && r.bench!==false && n(r.qty)>1 && n(r.price)>0);
      const per = packs.length ? median(packs.map(refPer30))*n(S.market.localFactor)/100 : clinicAvg()*0.6;
      return {price: per*n(p.use), perUnit: per, basis: packs.length ? `แพ็กหลายรอบในต่างประเทศ × ${fmt(S.market.localFactor)}% ≈ ${baht(per)} / รอบ × ${fmt(p.use)} รอบ` : `คลินิกไทย × 60% ≈ ${baht(per)} / รอบ × ${fmt(p.use)} รอบ`, refs: packs, local:false};
    }
    const thR = S.refs.filter(r=>r.kind==="session" && r.inAvg && n(r.price)>0);
    const per = clinicAvg();
    return {price: per, perUnit: per, basis:`คลินิกในไทย ${baht(per)} / 30 นาที`, refs: thR, local:true};
  }
  const L = rentalLen(p);
  const rents = S.refs.filter(r=>r.kind==="rent" && r.bench!==false && n(r.price)>0 && refDays(r));
  let pick;
  if(L<=2) pick = rents.filter(r=>refDays(r)<=2);
  else if(L<=5) pick = rents.filter(r=>refDays(r)>=2 && refDays(r)<=5);
  else if(L<=20) pick = rents.filter(r=>refDays(r)>=6 && refDays(r)<=20);
  else pick = rents.filter(r=>refDays(r)>=21);
  if(!pick.length) pick = rents;
  const th = pick.filter(r=>r.country==="ไทย");
  const use = th.length ? th : pick;
  const local = th.length>0;
  const perDay = median(use.map(refPerDay)) * (local?1:n(S.market.localFactor)/100);
  const days = p.per==="เดือน" ? n(p.use) : L;
  return {price: perDay*days, perUnit: perDay, basis:`${local?"ตลาดไทย":"ตลาดต่างประเทศ × "+fmt(S.market.localFactor)+"%"} ≈ ${baht(perDay)} / วัน × ${fmt(days)} วัน`, refs: use, local};
}

function compute(ov={}){
  const m=S.machine, o=S.ops;
  const count = ov.count ?? n(m.count), price = ov.price ?? n(m.price);
  const pm = ov.priceMul ?? n(S.whatIf.price)/100, dm = ov.demandMul ?? n(S.whatIf.demand)/100;
  const H = Math.max(1, Math.min(60, Math.round(n(o.horizon))||36));
  const capacity = count*30*n(m.maxUtil)/100;
  const setup = S.setup.reduce((a,x)=>a+n(x.amount),0);
  const investMachines = count*(price+n(m.accessories));
  const invest = investMachines + setup;
  const sleeveM = count*n(m.sleeveCost)/Math.max(1,n(m.sleeveEvery));
  const fixed = S.monthly.reduce((a,x)=>a+n(x.amount),0) + sleeveM;
  const depM = investMachines*(1-n(m.resalePct)/100)/Math.max(1,n(m.lifeMonths));
  const lossPct = (n(o.damagePct)+n(o.payFeePct))/100;
  const progs = S.programs.filter(p=>p.on).map(p=>{
    const override = ov.progPrice && ov.progPrice[p.id]!=null ? ov.progPrice[p.id] : n(p.price);
    return {p, base:n(p.qty)+clubSeats(p.id), unitPrice:override*pm, md:machineDays(p), vu:varUnit(p), share:n(p.revShare)/100, uses:usesOf(p)};
  });
  function month(r,g){
    let dmd=0; progs.forEach(x=>{ x.q=x.base*dm*r*g; dmd+=x.q*x.md; });
    const scale = dmd>capacity && dmd>0 ? capacity/dmd : 1;
    let rev=0,vc=0,sh=0; const by={};
    progs.forEach(x=>{ const q=x.q*scale, rv=q*x.unitPrice, v=q*x.vu, s=rv*x.share; rev+=rv; vc+=v; sh+=s; by[x.p.id]={q,rev:rv,profit:rv-v-s-rv*lossPct}; });
    const loss=rev*lossPct, ebitda=rev-vc-sh-loss-fixed, tax=Math.max(0,ebitda-depM)*n(o.taxPct)/100;
    return {rev,vc,sh,loss,fixed,ebitda,tax,net:ebitda-tax,by,dmd,used:Math.min(dmd,capacity),sold:scale<1};
  }
  const rampN=Math.max(1,Math.round(n(o.rampMonths))), r0=n(o.rampStart)/100, gr=n(o.growthPct)/100;
  const series=[]; let cum=-invest, pay=null;
  for(let i=1;i<=H;i++){
    const r = rampN<=1?1:Math.min(1, r0+(1-r0)*(i-1)/(rampN-1));
    const mo = month(r, Math.pow(1+gr,i-1));
    const prev=cum; cum+=mo.net; mo.cum=cum; mo.i=i;
    if(pay==null && cum>=0) pay=(i-1)+(mo.net>0?(-prev)/mo.net:0);
    series.push(mo);
  }
  const st = month(1,1);
  const util = capacity>0 ? st.dmd/capacity : 0;
  const perMachine = 30*n(m.maxUtil)/100;
  const need = perMachine>0 ? Math.ceil(st.dmd/perMachine) : 0;
  // cost per used machine-day (capital paid back in target months + fixed)
  const usedMD = Math.max(1, st.used);
  const costPerMD = (invest/Math.max(1,n(o.targetMonths)) + fixed)/usedMD;
  return {count, price, invest, investMachines, setup, fixed, sleeveM, capacity, progs, series, st, util, need, H, costPerMD, lossPct,
          payback:pay, end:cum, resale:count*price*n(m.resalePct)/100,
          customers: progs.reduce((a,x)=>a+((st.by[x.p.id]||{}).q||0),0)};
}
function floorFor(p, R){
  const share=n(p.revShare)/100, denom=Math.max(.05, 1-share-R.lossPct);
  return {target:(varUnit(p)+machineDays(p)*R.costPerMD)/denom, cash: varUnit(p)/denom};
}
function suggestFor(p, R){
  const mk = marketFor(p), fl = floorFor(p,R);
  const disc = p.useType==="sessions" ? n(S.market.sessionDiscount) : n(S.market.discount);
  const byMarket = mk.price*(1-disc/100);
  const byCost = fl.target*(1+n(S.market.markup)/100);
  return {mk, fl, disc, value: nicePrice(Math.max(byMarket, fl.target)), byMarket:nicePrice(byMarket), byCost:nicePrice(byCost)};
}

/* ================= storage ================= */
let docRef=null, saveTimer=null, saving=false, again=false, lastJSON="", loadTimer=null;
function setSave(s,t){ $("#saveDot").dataset.s=s; $("#saveTxt").textContent=t; }
function persistLocal(){ try{ localStorage.setItem("nrp-state", JSON.stringify(S)); }catch(e){} }
function scheduleSave(){
  persistLocal();
  if(!docRef){ setSave("local","บันทึกในเครื่องแล้ว"); return; }
  setSave("saving","กำลังบันทึก");
  clearTimeout(saveTimer); saveTimer=setTimeout(doSave,900);
}
async function doSave(){
  saveTimer=null; if(saving){ again=true; return; } saving=true;
  const json=JSON.stringify(S);
  try{ await docRef.set({state:JSON.parse(json),updatedAt:Date.now()}); lastJSON=json; setSave("ok","บันทึกแล้ว"); }
  catch(e){ if(e&&e.code==="invalid_argument"){ setSave("err","ดูอย่างเดียว"); docRef=null; } else setSave("err","บันทึกไม่สำเร็จ"); }
  saving=false; if(again){ again=false; doSave(); }
}
function connect(){
  if(!IN_CLAUDE){ setSave("local","บันทึกในเครื่อง"); return; }
  window.claude.use("db").then(db=>{
    if(!db){ setSave("local","บันทึกในเครื่อง"); return; }
    docRef=db.doc("app/state");
    loadTimer=setTimeout(()=>setSave("err","ยังโหลดไม่ได้"),10000);
    docRef.onSnapshot(snap=>{
      if(!snap.metadata.fromCache) clearTimeout(loadTimer);
      if(!snap.exists){ if(!snap.metadata.fromCache) setSave("ok","พร้อมบันทึก"); return; }
      const json=JSON.stringify((snap.data()||{}).state||{});
      if(saveTimer||saving||json===lastJSON){ if(!saveTimer&&!saving) setSave("ok","บันทึกแล้ว"); return; }
      const a=document.activeElement; if(a && a.matches && a.matches("input,textarea,select")) return;
      lastJSON=json; S=migrate(JSON.parse(json)); persistLocal(); setSave("ok","บันทึกแล้ว"); render(false);
    }, ()=>{ clearTimeout(loadTimer); setSave("err","ใช้ข้อมูลในเครื่อง"); docRef=null; });
  }).catch(()=>setSave("local","บันทึกในเครื่อง"));
}

/* ================= undo + mutate ================= */
function snapshotForUndo(){
  if(!undoArmed) return;
  undoStack.push(JSON.stringify(S)); if(undoStack.length>40) undoStack.shift();
  undoArmed=false; $("#undoBtn").disabled=false;
}
function rearmUndo(){ clearTimeout(undoTimer); undoTimer=setTimeout(()=>{undoArmed=true;},1200); }
function mutate(fn, opts={}){
  snapshotForUndo(); fn(); rearmUndo(); scheduleSave();
  if(opts.render) render(false); else refresh();
}
function undo(){
  const prev=undoStack.pop(); if(!prev) return;
  S=migrate(JSON.parse(prev)); undoArmed=true; scheduleSave(); render(false);
  $("#undoBtn").disabled=!undoStack.length; toast("ย้อนกลับแล้ว");
}

function groupTag(g){ const G=GROUPS[g]||GROUPS.rent; return `<span class="tag"><span class="dot" style="background:var(${G.color})"></span>${G.label}</span>`; }
function stepper(path, val, opts={}){
  return `<div class="stepper ${opts.sm?"sm":""}" data-step="${opts.step||"auto"}" data-k="${path}" data-min="${opts.min??0}">
    <button type="button" data-act="dec" aria-label="ลด">−</button>

}
function field(path, label, opts={}){
  const v=getPath(S,path), id="f-"+path.replace(/\./g,"-");
  if(opts.type==="select") return `<div class="f ${opts.wide?"wide":""}"><label for="${id}">${label}</label><select id="${id}" data-k="${path}" ${opts.num?'data-t="n"':""} ${opts.rr?'data-rr="1"':""}>${opts.options.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v)?"selected":""}>${esc(b)}</option>`).join("")}</select>${opts.help?`<span class="help">${opts.help}</span>`:""}</div>`;
  if(opts.type==="text"||opts.type==="url") return `<div class="f ${opts.wide?"wide":""}"><label for="${id}">${label}</label><input id="${id}" type="${opts.type}" data-k="${path}" value="${esc(v)}" ${opts.ph?`placeholder="${esc(opts.ph)}"`:""}>${opts.help?`<span class="help">${opts.help}</span>`:""}</div>`;
  if(opts.type==="check") return `<label class="toggle ${opts.wide?"wide":""}"><input type="checkbox" data-k="${path}" data-t="b" ${opts.rr?'data-rr="1"':""} ${v?"checked":""}> ${label}</label>`;
  return `<div class="f ${opts.wide?"wide":""}"><label>${label}${opts.unit?` <span style="opacity:.7">(${opts.unit})</span>`:""}</label>${stepper(path,v,{sm:true,step:opts.step,min:opts.min,label})}${opts.help?`<span class="help">${opts.help}</span>`:""}</div>`;
}

/* sheets (modals) */
let sheetOnClose=null;
function openSheet(title, body, foot="", onClose=null){
  const L=$("#layer");
  L.innerHTML = `<div class="scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><h3>${esc(title)}</h3><button class="xbtn" data-act="closeSheet" aria-label="ปิด">×</button></div>
    <div class="sheet-body">${body}</div>${foot?`<div class="sheet-foot">${foot}</div>`:""}</div>`;
  sheetOnClose=onClose;
  requestAnimationFrame(()=>{ $(".scrim",L).classList.add("show"); $(".sheet",L).classList.add("show"); const f=$(".sheet input[type=text]",L); if(f && !matchMedia("(max-width:760px)").matches) f.focus(); });

function closeSheet(){
  const L=$("#layer"), sh=$(".sheet",L), sc=$(".scrim",L);
  if(!sh) return;
  sh.classList.remove("show"); sc.classList.remove("show");
  setTimeout(()=>{ L.innerHTML=""; if(sheetOnClose){ const f=sheetOnClose; sheetOnClose=null; f(); } },260);
}

function todos(R){
  const st=R.st, list=[], tgt=n(S.ops.targetMonths);
  const under = S.programs.filter(p=>p.on && n(p.price) < floorFor(p,R).cash);
  if(under.length) list.push(["bad","!",`${under.map(p=>esc(p.name)).join(", ")} ราคาต่ำกว่าค่าส่งและค่าทำความสะอาด ขาดทุนทุกครั้งที่ขาย`, `<button class="btn sm" data-go="pricing">แก้ราคา</button>`]);
  if(R.payback==null || R.payback>tgt) list.push(["warn","!",`คืนทุนช้ากว่าเป้า ลองกด "ใช้ราคาแนะนำ" หรือหาลูกค้าสโมสรเพิ่ม`, `<button class="btn sm" data-act="applyAll" data-mode="suggest">ใช้ราคาแนะนำทั้งหมด</button>`]);
  else list.push(["good","✓",`คืนทุนในเดือนที่ ${Math.ceil(R.payback)} เร็วกว่าเป้า ${tgt} เดือน`, ""]);
  if(R.util>1) list.push(["bad","!",`ลูกค้าเกินความจุเครื่อง ต้องมี ${R.need} เครื่อง`, `<button class="btn sm" data-act="setMachines" data-v="${R.need}">ตั้งเป็น ${R.need} เครื่อง</button>`]);
  const pend = S.clubs.filter(c=>c.status==="target").length;
  if(pend) list.push(["info","→",`มีสโมสรเป้าหมายที่ยังไม่ได้ติดต่อ ${pend} แห่ง เริ่มจากที่ใกล้ที่สุดก่อน`, `<button class="btn ghost sm" data-go="clubs">ดูรายชื่อ</button>`]);
  list.push(["info","→","ส่งใบราคาให้ลูกค้าหรือสโมสร เป็นรูปหรือ PDF", `<button class="btn ghost sm" data-go="sheet">เปิดใบราคา</button>`]);
  return list.map(([c,i,t,a])=>`<li><span class="ic ${c}">${i}</span><div>${t}${a?`<div class="act">${a}</div>`:""}</div></li>`).join("");
}

    </div>

      <button class="chip soft" data-act="setPrice" data-i="${i}" data-v="${nicePrice(sg.mk.price)}">ตามตลาด ${baht(nicePrice(sg.mk.price))}</button>
      <button class="chip soft" data-act="setPrice" data-i="${i}" data-v="${sg.byMarket}">ตลาด −${fmt(sg.disc)}% ${baht(sg.byMarket)}</button>

function plData(){
  const clinic=clinicAvg(), hid=S.sheet.hidden||[];
  return Object.keys(GROUPS).map(g=>({g, items:S.programs.filter(p=>p.on && p.group===g && !hid.includes(p.id)).map(p=>{

  const ret=S.refs.filter(r=>r.kind==="retail"&&n(r.price)>0&&r.country==="ไทย").map(refTHB);
  return [
    ["คลินิกในไทย","ต่อ 30 นาที", avg(ses.filter(r=>r.inAvg).map(refPer30)), ses.filter(r=>r.inAvg).length],

function countUp(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  $$("[data-count]").forEach(el=>{
    const end=Number(el.dataset.count); if(!isFinite(end)) return;
    const t0=performance.now(), d=650;
    const tick=t=>{ const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); el.textContent=baht(end*e); if(k<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}

const loaded={};
function loadScript(src){
  if(loaded[src]) return loaded[src];
  return loaded[src]=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>{delete loaded[src]; rej(new Error("load"));}; document.head.appendChild(s); });
}
async function saveFile(blob, name){
  if(IN_CLAUDE){
    try{
      const d=await window.claude.use("downloads");
      if(d){ await d.save({filename:name,data:blob}); toast("บันทึกไฟล์แล้ว"); return; }
    }catch(e){ if(e&&e.code==="declined") return; toast("บันทึกไฟล์ไม่ได้ในหน้านี้"); return; }
  }
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); toast("บันทึก "+name+" แล้ว");
}

async function b64encode(str){
  const bytes=new TextEncoder().encode(str);
  let data=bytes;
  if(window.CompressionStream){ data=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer()); }
  let s=""; data.forEach(b=>s+=String.fromCharCode(b));
  return (window.CompressionStream?"z":"p")+btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function b64decode(t){
  const mode=t[0], b=t.slice(1).replace(/-/g,"+").replace(/_/g,"/");
  const bin=atob(b), arr=Uint8Array.from(bin,c=>c.charCodeAt(0));
  if(mode==="z"){ return new TextDecoder().decode(await new Response(new Blob([arr]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer()); }
  return new TextDecoder().decode(arr);
}

    const x=JSON.parse(await b64decode(h.slice(8)));
    openSheet("นำเข้าข้อมูลจากลิงก์", `<p>ลิงก์นี้มีข้อมูลแผน Normatec (${(x.programs||[]).length} โปรแกรม · ${(x.clubs||[]).length} สโมสร · ${(x.refs||[]).length} แหล่งอ้างอิง) ต้องการแทนที่ข้อมูลในเครื่องนี้หรือไม่?</p>`,
      `<button class="btn ghost sm" data-act="closeSheet">ไม่ใช่ตอนนี้</button><button class="btn sm" data-act="confirmImport">แทนที่ข้อมูล</button>`);
    window.__pendingImport=x;
  }catch(e){ toast("ลิงก์ข้อมูลไม่สมบูรณ์"); }
  try{ history.replaceState(null,"","#"+page); }catch(e){}
}

/* ================= events ================= */
function applyInput(el){
  const k=el.dataset.k; if(!k) return false;
  let v = el.dataset.t==="b" ? el.checked : el.dataset.t==="n" ? (el.value===""?0:Number(el.value)) : el.value;
  if(el.dataset.t==="n" && !isFinite(v)) return false;
  setPath(S,k,v);
  const mm=k.match(/^clubs\.(\d+)\.status$/); if(mm){ const s=STATUS.find(x=>x.k===v); if(s) S.clubs[+mm[1]].prob=s.prob; }
  return true;
}
document.addEventListener("click", async e=>{
  if(e.target.closest("[data-stop]")) return;
  const t=e.target.closest("[data-go],[data-act],[data-flt]"); if(!t) return;
  if(t.dataset.go){ closeSheet(); go(t.dataset.go); return; }
  if(t.dataset.flt){ flt[t.dataset.flt]=t.dataset.v; render(false); return; }
  const a=t.dataset.act, i=+t.dataset.i;
  switch(a){
    case "inc": case "dec": {
      const box=t.closest(".stepper"), inp=$("input",box), k=box.dataset.k;
      const cur=n(getPath(S,k)), stepA=box.dataset.step;
      const step = stepA==="auto" ? priceStep(cur) : n(stepA)||1;
      let v = a==="inc" ? cur+step : cur-step;
      v = Math.max(n(box.dataset.min), Math.round(v*100)/100);
      mutate(()=>setPath(S,k,v));
      inp.value=v; inp.classList.remove("flash"); void inp.offsetWidth; inp.classList.add("flash");
      if(k.startsWith("programs.")) softRerender();
      break; }
    case "setPrice": mutate(()=>{S.programs[i].price=n(t.dataset.v);},{render:true}); toast("ตั้งราคาแล้ว"); pulse(`[data-pid="${S.programs[i].id}"]`); break;
    case "applyAll": {
      const R=compute(), mode=t.dataset.mode;
      mutate(()=>S.programs.forEach(p=>{ const sg=suggestFor(p,R); p.price = mode==="market"?sg.byMarket : mode==="cost"?sg.byCost : sg.value; }),{render:true});
      toast("ปรับราคาทุกโปรแกรมแล้ว · กดย้อนกลับได้"); break; }
    case "showBasis": basisSheet(i); break;
    case "pricingRules": rulesSheet(); break;
    case "editProgram": editProgram(i); break;
    case "addProgram": addProgramSheet(); break;
    case "addProgramType": {
      const g=t.dataset.g;
      const tpl={rent:{name:"เช่าใหม่ · 2 วัน",price:790,per:"ครั้ง",qty:2,useType:"days",use:2.5,uses:3,handovers:1,revShare:0},
        sub:{name:"สมาชิกใหม่",price:2990,per:"เดือน",qty:1,useType:"days",use:8,uses:8,handovers:2,revShare:0},
        club:{name:"แพ็กเกจสโมสรใหม่",price:990,per:"เดือน",qty:10,useType:"sessions",use:4,uses:4,handovers:0,revShare:15},
        session:{name:"รอบบริการใหม่",price:300,per:"ครั้ง",qty:20,useType:"sessions",use:1,uses:1,handovers:0,revShare:15}}[g];
      mutate(()=>S.programs.push(Object.assign({id:uid("p"),on:true,group:g,minTerm:0,desc:""},tpl)));
      flt.progGroup="all"; closeSheet(); setTimeout(()=>{ if(page!=="pricing") page="pricing"; render(false); editProgram(S.programs.length-1); },280); break; }
    case "dupProgram": mutate(()=>{ const c=clone(S.programs[i]); c.id=uid("p"); c.name+=" (สำเนา)"; S.programs.splice(i+1,0,c); }); closeSheet(); break;
    case "delProgram": mutate(()=>S.programs.splice(i,1)); closeSheet(); toast("ลบแล้ว · กดย้อนกลับได้"); break;
    case "delItem": mutate(()=>S[t.dataset.list].splice(i,1)); closeSheet(); toast("ลบแล้ว · กดย้อนกลับได้"); break;
    case "del": mutate(()=>S[t.dataset.list].splice(i,1),{render:true}); break;
    case "addRow": mutate(()=>S[t.dataset.list].push({name:"รายการใหม่",amount:0}),{render:true}); break;
    case "editClub": editClub(i); break;
    case "nextStatus": {
      e.stopPropagation();
      const order=["target","contact","trial","won"]; const c=S.clubs[i]; const k=order[(order.indexOf(c.status)+1)%order.length]||"target";
      mutate(()=>{ c.status=k; c.prob=STATUS.find(s=>s.k===k).prob; },{render:true}); toast(`${c.name}: ${STATUS.find(s=>s.k===k).label}`); break; }
    case "addClub": {
      mutate(()=>S.clubs.unshift({id:uid("c"),name:"สโมสรใหม่",type:"วิ่ง",area:"",status:"target",prob:10,members:0,seats:10,programId:(S.programs.find(p=>p.group==="club")||S.programs[0]||{}).id||"",contact:"",note:"",url:""}),{render:true});
      flt.clubStatus="all"; editClub(0); break; }
    case "addRef": {
      mutate(()=>S.refs.unshift({id:uid("r"),name:"แหล่งใหม่",item:"",kind:"rent",country:"ไทย",price:0,currency:"THB",qty:1,unit:"day",minutes:30,inAvg:false,bench:true,url:"",note:"",date:stamp()}),{render:true});
      flt.refScope="all"; flt.refKind="all"; editRef(0); break; }
    case "editRef": editRef(i); break;
    case "goMarket": closeSheet(); go("market"); break;
    case "setLocal": mutate(()=>S.market.localFactor=n(t.dataset.v),{render:true}); break;
    case "setMachinePrice": mutate(()=>S.machine.price=n(t.dataset.v),{render:true}); break;
    case "machines": mutate(()=>S.machine.count=Math.max(1,n(S.machine.count)+n(t.dataset.d)),{render:true}); toast(`ตอนนี้ ${S.machine.count} เครื่อง`); break;
    case "setMachines": mutate(()=>S.machine.count=n(t.dataset.v),{render:true}); break;
    case "resetWhatIf": mutate(()=>S.whatIf={price:100,demand:100},{render:true}); break;
    case "sheetOpt": { const k=t.dataset.k, v=t.dataset.v; mutate(()=>S.sheet[k]= v==="true"?true: v==="false"?false: v,{render:true}); break; }
    case "sheetToggle": { const id=t.dataset.id; mutate(()=>{ const h=S.sheet.hidden||(S.sheet.hidden=[]); const j=h.indexOf(id); j>=0?h.splice(j,1):h.push(id); },{render:true}); break; }
    case "sheetText": sheetTextSheet(); break;
    case "exp": exportAs(t.dataset.f); break;
    case "print": window.print(); break;
    case "moreMenu": openSheet("เพิ่มเติม", `<div class="tpl">${PAGES.filter(p=>!p.bot).map(p=>`<button data-go="${p.k}"><b>${p.label}</b><span class="hint">${{market:"ราคาคู่แข่งและแหล่งอ้างอิง",costs:"ราคาเครื่อง ค่าใช้จ่าย ตารางรายเดือน",config:"ติดตั้งแอป ย้ายข้อมูล อัตราแลกเปลี่ยน"}[p.k]}</span></button>`).join("")}</div>`); break;
    case "closeSheet": closeSheet(); break;
    case "shareLink": shareLink(); break;
    case "confirmImport": snapshotForUndo(); S=migrate(window.__pendingImport); undoArmed=true; scheduleSave(); closeSheet(); render(false); toast("นำเข้าข้อมูลแล้ว"); break;
    case "install": if(window.__bip){ window.__bip.prompt(); window.__bip=null; t.hidden=true; } break;
    case "askReset": $("#resetConfirm").hidden=false; break;
    case "cancelReset": $("#resetConfirm").hidden=true; break;
    case "doReset": mutate(()=>{ const keep={clubs:S.clubs,refs:S.refs}; S=Object.assign(clone(DEFAULT),keep); },{render:true}); toast("คืนค่าแล้ว · กดย้อนกลับได้"); break;
  }
});
function pulse(sel){ setTimeout(()=>{ const el=$(sel); if(el){ el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); } },30); }
let softT=null;
function softRerender(){ clearTimeout(softT); softT=setTimeout(()=>{ if(!document.activeElement || !document.activeElement.closest || !document.activeElement.closest(".stepper input")) render(false); },650); }
document.addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="z" && !e.shiftKey && !(e.target.matches&&e.target.matches("input[type=text],textarea"))){ e.preventDefault(); undo(); }
  if(e.key==="Escape") closeSheet();
  if(e.key==="Enter" && e.target.matches && e.target.matches('[role="button"]')) e.target.click();
});
document.addEventListener("input", e=>{
  const el=e.target; if(!el.dataset||!el.dataset.k||el.tagName==="SELECT"||el.type==="checkbox"||el.type==="file") return;
  snapshotForUndo();
  if(applyInput(el)){ rearmUndo(); scheduleSave(); refresh(); if(el.type==="range") updateSliderText(); }
});
function updateSliderText(){ /* text outputs are refreshed by refresh() */ }
document.addEventListener("change", e=>{
  const el=e.target; if(!el.dataset||!el.dataset.k) return;
  if(el.tagName==="SELECT"||el.type==="checkbox"){ snapshotForUndo(); if(applyInput(el)){ rearmUndo(); scheduleSave(); if(el.dataset.rr && $(".sheet")){ const title=$(".sheet-head h3").textContent; const m=el.dataset.k.match(/^(\w+)\.(\d+)\./); if(m){ const fn={programs:editProgram,clubs:editClub,refs:editRef}[m[1]]; if(fn){ $("#layer").innerHTML=""; fn(+m[2]); $(".sheet").classList.add("show"); $(".scrim").classList.add("show"); } } } else if(!$(".sheet")) render(false); else refresh(); } }
  else if(el.dataset.t==="n" && el.closest(".prog")) render(false);
});
$("#undoBtn").addEventListener("click", undo);
window.addEventListener("hashchange", ()=>{ const h=location.hash.slice(1); if(h.startsWith("import=")) checkImportHash(); else if(h && h!==page) go(h); });
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render(false)); }catch(e){}
new MutationObserver(()=>render(false)).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
function isStandalone(){ return matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true; }
window.addEventListener("beforeinstallprompt", e=>{ e.preventDefault(); window.__bip=e; const b=$("#installBtn"); if(b) b.hidden=false; });

/* ================= boot ================= */
if(isStandalone()) document.documentElement.classList.add("standalone");
const h0=location.hash.slice(1);
page = PAGES.some(p=>p.k===h0) ? h0 : "summary";
render(true);
connect();
checkImportHash();
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{ const w=reg.installing; w&&w.addEventListener("statechange",()=>{ if(w.state==="installed" && navigator.serviceWorker.controller) toast("มีเวอร์ชันใหม่ · ปิดแล้วเปิดแอปอีกครั้งเพื่ออัปเดต"); }); });
  }).catch(()=>{}));
}
})();
</script>
