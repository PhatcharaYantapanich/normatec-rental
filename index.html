<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Normatec Pricing</title>
<meta name="description" content="วางแผนธุรกิจให้เช่าเครื่อง Normatec: ตั้งราคาตามระยะเวลา เทียบราคาอ้างอิง และดูความคุ้ม">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Normatec">
<meta name="application-name" content="Normatec">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff; --bg2:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --accent:#0071e3; --accent-ink:#fff;
  --good:#1a7f37; --warn:#b25000; --bad:#d70015; --good-bg:#e8f5ec; --warn-bg:#fff4e5; --bad-bg:#fdecee;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","IBM Plex Sans Thai",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000; --bg2:#1c1c1e; --card:#1c1c1e; --ink:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c; --accent:#2997ff; --accent-ink:#000;
  --good:#30d158; --warn:#ff9f0a; --bad:#ff453a; --good-bg:#0f2a17; --warn-bg:#33240a; --bad-bg:#3a1214; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.47;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .in{display:flex;align-items:center;gap:10px;height:48px}
.brand{font-weight:700;letter-spacing:-.01em;font-size:16px;white-space:nowrap}
.tabs{display:flex;gap:2px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--bg2);color:var(--ink);font-weight:600}
.lang{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
@media (max-width:700px){.brand{display:none}.tabs{margin:0;flex:1}.tabs button{padding:6px 10px;font-size:13.5px}}

h1{font-size:clamp(28px,5vw,40px);line-height:1.1;font-weight:700;letter-spacing:-.015em;margin:28px 0 6px}
.sub{color:var(--muted);font-size:16px;margin:0 0 18px;max-width:640px}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:30px 0 4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}

/* scenario bar */
.scbar{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.scbar::-webkit-scrollbar{display:none}
.pillb{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.pillb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.pillb.add{color:var(--accent);border-style:dashed}
.scedit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.scedit input{flex:1;min-width:160px}
.link{border:0;background:none;color:var(--accent);font-size:14px;cursor:pointer;padding:6px 2px}
.link.del{color:var(--bad)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--bg2);color:var(--ink)}

input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;width:100%;min-width:0}
input[type=text]:focus,select:focus{border-color:var(--accent);outline:none}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 6px}
.stat{background:var(--bg2);border-radius:16px;padding:14px 16px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.01em}
.stat .n{font-size:12.5px;color:var(--muted)}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}.stat .v{font-size:19px}}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.good{background:var(--good-bg);color:var(--good)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.neu{background:var(--bg2);color:var(--muted)}
.verdict{border-radius:16px;padding:14px 16px;margin:10px 0;font-size:15px}
.verdict b{display:block;font-size:16px}

/* card + price rows */
.card{background:var(--bg2);border-radius:18px;padding:16px;margin:10px 0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick .q{display:grid;gap:6px}
.quick label{font-size:13px;color:var(--muted)}
.quick .r{display:flex;gap:8px}
@media (max-width:700px){.quick{grid-template-columns:1fr}}
.drow{display:grid;grid-template-columns:1fr auto 28px;gap:4px 12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.drow .dl b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
.drow .dl span{font-size:13px;color:var(--muted)}
.dp{display:flex;align-items:baseline;gap:4px;font-size:24px;font-weight:700}
.dp input{width:5.2ch;box-sizing:content-box;font-size:24px;font-weight:700;text-align:right;padding:4px 8px;border-radius:10px}
.chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;line-height:1}
.x:hover{color:var(--bad)}
.addrow{display:flex;gap:8px;align-items:center;padding:14px 0;flex-wrap:wrap}
.addrow input{width:110px}

/* groups */
.g{background:var(--bg2);border-radius:18px;padding:14px 16px;margin:10px 0}
.g .gh{display:flex;gap:8px;align-items:center}
.g .gf{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:12.5px;color:var(--muted)}
.g .go{margin-top:10px;font-size:14px;color:var(--muted)}
.g .go b{color:var(--ink)}
@media (max-width:700px){.g .gf{grid-template-columns:1fr 1fr}}
.step{display:inline-flex;align-items:center;gap:14px;background:var(--bg2);border-radius:999px;padding:6px 8px}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:var(--bg);font-size:20px;cursor:pointer}
.step b{font-size:18px;min-width:5ch;text-align:center}

/* result list */
.rl{border-top:1px solid var(--line);margin-top:6px}
.rl .r{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.rl .r span{color:var(--muted)}
.rl .r b{font-size:17px;text-align:right}
.rl .r.tot b{font-size:21px}
.bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
details.set{background:var(--bg2);border-radius:18px;padding:14px 16px;margin:18px 0}
details.set summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
details.set summary::-webkit-details-marker{display:none}
details.set summary::after{content:"＋";color:var(--accent);font-weight:400}
details.set[open] summary::after{content:"－"}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}

/* compare (Apple-style columns) */
.cmp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.cmp{min-width:var(--minw)}
.cmp .row{display:grid;grid-template-columns:var(--cols);align-items:start}
.cmp .colhead{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 0 12px}
.cmp .colhead .cell{text-align:center;padding:0 6px;display:grid;gap:4px;justify-items:center}
.cmp .name{font-size:13px;color:var(--muted)}
.cmp .price{font-size:26px;font-weight:700;letter-spacing:-.01em}
.cmp .price small{font-size:12.5px;font-weight:500;color:var(--muted)}
.cmp .sec{font-size:21px;font-weight:700;letter-spacing:-.01em;padding:34px 0 6px;border-bottom:1px solid var(--line)}
.cmp .sec small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.cmp .item{border-bottom:1px solid var(--line);padding:15px 0}
.cmp .item .label{font-size:13px;color:var(--muted);padding-right:10px}
.cmp .item .label b{display:block;color:var(--ink);font-weight:600;font-size:15px}
.cmp .item .cell{text-align:center;padding:0 6px}
.cmp .v{font-size:19px;font-weight:600;letter-spacing:-.01em}
.cmp .note{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.cmp .ref .v,.cmp .ref .price{color:var(--muted)}

/* benchmark list */
.bn{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.bn .bf{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
.bn .bm{grid-column:2;font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bn .bm a{color:var(--accent)}
@media (max-width:700px){.bn .bf{grid-template-columns:1fr 1fr}.bn .bf .f:first-child{grid-column:1/-1}}
.sw{position:relative;width:44px;height:26px;margin-top:22px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{pointer-events:none;position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--good)}
.sw input:checked+i::after{transform:translateX(18px)}
.sumt{width:100%;border-collapse:collapse;font-size:14px}
.sumt th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:right;padding:6px 8px}
.sumt td{padding:8px;text-align:right;border-top:1px solid var(--line)}
.sumt th:first-child,.sumt td:first-child{text-align:left}

.foot{color:var(--muted);font-size:12.5px;padding:28px 0 calc(40px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:36px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media print{.top,.scbar,.scedit,.foot,.quick,.addrow,.x,details.set{display:none!important}.cmp .colhead{position:static}}
</style>
</head>
<body>
<div class="top"><div class="wrap in">
  <span class="brand">Normatec Pricing</span>
  <nav class="tabs" id="tabs"></nav>
  <button class="lang" id="langBtn" aria-label="Language"></button>
</div></div>
<div class="wrap">
  <main id="out"></main>
  <div class="foot">
    <button class="link" data-a="backup" id="fBackup"></button>
    <label class="link" style="cursor:pointer"><span id="fRestore"></span><input type="file" id="restoreFile" accept="application/json,.json" hidden></label>
    <button class="link" data-a="print" id="fPrint"></button>
    <button class="link del" data-a="reset" id="fReset"></button>
    <span id="fNote"></span>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
const W=4.33, KEY="nrp2-state";
const DEFAULT={
  v:2, lang:"th", active:0, durations:[30,45,60,90,120],
  cost:{machinePrice:34000,startupOther:16000,otherMonthly:5227,reservePct:5,hoursPerDay:3,daysPerWeek:5,target:12,localFactor:70,exp:0.85},
  scen:[
    {name:"แบบ A · ราคาเข้าถึงง่าย",units:5,prices:{30:80,45:115,60:150,90:210,120:260},
     groups:[{name:"ฟุตบอล (Chamchuri United)",people:25,perWeek:3,min:30,disc:0},{name:"ชมรมคาราเต้",people:15,perWeek:2,min:30,disc:0}]},
    {name:"แบบ B · ราคากลาง",units:5,prices:{30:110,45:155,60:200,90:280,120:350},
     groups:[{name:"ฟุตบอล (Chamchuri United)",people:20,perWeek:3,min:30,disc:0},{name:"ชมรมคาราเต้",people:12,perWeek:2,min:30,disc:0}]},
    {name:"แบบ C · พรีเมียม",units:5,prices:{30:135,45:195,60:250,90:350,120:440},
     groups:[{name:"ฟุตบอล (Chamchuri United)",people:15,perWeek:3,min:30,disc:0},{name:"ชมรมคาราเต้",people:10,perWeek:2,min:30,disc:0}]}
  ],
  bench:[
    {name:"Super Young (กรุงเทพฯ) · Normatec Boots",price:1260,min:30,type:"session",th:true,use:true,url:"https://longevity-dtn.pages.dev/compression-therapy",note:"US$38.25"},
    {name:"Ritual Biohacking (กรุงเทพฯ) · Normatec 3",price:2475,min:60,type:"session",th:true,use:true,url:"https://longevity-dtn.pages.dev/compression-therapy",note:"US$75"},
    {name:"Kollectiv (New York) · 15 นาที",price:660,min:15,type:"session",th:false,use:true,url:"https://kollectivnyc.com/normatec/",note:"US$20"},
    {name:"Kollectiv (New York) · 30 นาที",price:990,min:30,type:"session",th:false,use:true,url:"https://kollectivnyc.com/normatec/",note:"US$30"},
    {name:"Kollectiv (New York) · 60 นาที",price:1815,min:60,type:"session",th:false,use:true,url:"https://kollectivnyc.com/normatec/",note:"US$55"},
    {name:"Exercise with Mason (Airbnb) · ไปถึงบ้าน",price:1980,min:30,type:"session",th:false,use:true,url:"https://th.airbnb.com/services/6064767",note:"US$60"},
    {name:"MP Massage Therapy (Morzine) · รีสอร์ตสกี",price:2090,min:60,type:"session",th:false,use:false,url:"https://mpmassagetherapy.com/recovery-boots/",note:"€55 · ราคารีสอร์ตสกี"},
    {name:"Mid West Physiotherapy (ไอร์แลนด์) · เช่ารายวัน",price:950,min:0,type:"day",th:false,use:true,url:"https://midwestphysio.ie/services/normatec-recovery-boots-rental/",note:"€25/วัน"},
    {name:"Thrive Massage Therapy (นิวซีแลนด์) · เช่ารายวัน",price:585,min:0,type:"day",th:false,use:true,url:"https://www.thrivemassagetherapy.co.nz/normatec-3-leg-system-rental/",note:"NZ$30/วัน"},
    {name:"Total Conditioning (แคนาดา) · สุดสัปดาห์ 3 วัน",price:588,min:0,type:"day",th:false,use:true,url:"https://www.osteopathicconditioning.ca/product-page/nomatec-legging-rental-weekend",note:"CA$75 ÷ 3 วัน"},
    {name:"Pro Sports Recovery (อังกฤษ) · 7 วัน",price:342,min:0,type:"day",th:false,use:true,url:"https://www.prosportsrecovery.co.uk/normatec-3-legs/",note:"£55 ÷ 7 วัน"},
    {name:"Chain Driven Cycles (ไอร์แลนด์) · 7 วัน",price:326,min:0,type:"day",th:false,use:true,url:"https://chaindrivencycles.com/products/compression-boots-hire",note:"€60 ÷ 7 วัน"}
  ]
};
const clone=o=>JSON.parse(JSON.stringify(o));
let S=clone(DEFAULT);
try{ const s=JSON.parse(localStorage.getItem(KEY)||"null"); if(s&&s.v===2&&Array.isArray(s.scen)&&s.scen.length){ S=Object.assign(clone(DEFAULT),s); S.cost=Object.assign(clone(DEFAULT.cost),s.cost||{}); } }catch(e){}
let tab=(location.hash||"").slice(1); if(!["price","feas","compare","bench"].includes(tab)) tab="price";
let setOpen=false;
const $=s=>document.querySelector(s);
const L=(th,en)=>S.lang==="th"?th:en;
const n=v=>{ const x=parseFloat(String(v).replace(/,/g,"")); return isFinite(x)?x:0; };
const fmt=(v,d=0)=>(isFinite(v)?v:0).toLocaleString(S.lang==="th"?"th-TH":"en-US",{maximumFractionDigits:d});
const baht=v=>"฿"+fmt(Math.round(v));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r5=v=>Math.max(0,Math.round(v/5)*5);
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove("show"),2200); }
const cur=()=>S.scen[Math.min(S.active,S.scen.length-1)];
const durLabel=m=> m%60===0 ? fmt(m/60)+" "+L("ชั่วโมง","hr") : m>60 ? fmt(Math.floor(m/60))+" "+L("ชม.","hr")+" "+(m%60)+" "+L("นาที","min") : m+" "+L("นาที","min");

/* ---------- model ---------- */
function benchAt(D){
  const e=n(S.cost.exp)||1, lf=n(S.cost.localFactor)/100;
  const v=S.bench.filter(b=>b.use&&b.type==="session"&&n(b.price)>0&&n(b.min)>0)
    .map(b=>n(b.price)*(b.th?1:lf)*Math.pow(D/n(b.min),e)).sort((a,b)=>a-b);
  if(!v.length) return null;
  const mid=v.length%2?v[(v.length-1)/2]:(v[v.length/2-1]+v[v.length/2])/2;
  return {mid,lo:v[0],hi:v[v.length-1],count:v.length};
}
function benchDay(){
  const lf=n(S.cost.localFactor)/100;
  const v=S.bench.filter(b=>b.use&&b.type==="day"&&n(b.price)>0).map(b=>n(b.price)*(b.th?1:lf)).sort((a,b)=>a-b);
  if(!v.length) return null;
  return {mid:v.length%2?v[(v.length-1)/2]:(v[v.length/2-1]+v[v.length/2])/2,lo:v[0],hi:v[v.length-1],count:v.length};
}
function metrics(sc){
  const c=S.cost; let people=0,sessions=0,rev=0,mh=0; const gs=[];
  sc.groups.forEach(g=>{ const ses=n(g.people)*n(g.perWeek)*W, p=n(sc.prices[g.min]), r=ses*p*(1-n(g.disc)/100);
    people+=n(g.people); sessions+=ses; rev+=r; mh+=ses*n(g.min)/60; gs.push({ses,rev:r,price:p}); });
  const units=n(sc.units), perUnit=n(c.hoursPerDay)*n(c.daysPerWeek)*W, cap=units*perUnit;
  const invest=units*n(c.machinePrice)+n(c.startupOther);
  const reserve=rev*n(c.reservePct)/100, net=rev-reserve-n(c.otherMonthly);
  const payback=net>0?invest/net:null, target=n(c.target)||12;
  const needRev=(invest/target+n(c.otherMonthly))/(1-n(c.reservePct)/100);
  const factor=rev>0?needRev/rev:null;
  return {people,sessions,rev,mh,gs,units,cap,util:cap>0?mh/cap:0,invest,reserve,net,payback,target,needRev,factor,
    minPeople:factor!=null?Math.ceil(people*factor):null, unitsNeed:perUnit>0?Math.ceil(mh/perUnit):0};
}
function verdict(m){
  if(m.rev<=0) return {c:"neu",t:L("ยังไม่มีรายได้","No revenue yet"),d:L("ใส่ราคาและจำนวนลูกค้าก่อน","Enter prices and customers first")};
  if(m.util>1) return {c:"warn",t:L("เครื่องไม่พอ","Not enough machines"),d:L(`ลูกค้าเท่านี้ต้องใช้ ${m.unitsNeed} เครื่อง แต่มี ${m.units} เครื่อง`,`This demand needs ${m.unitsNeed} units; you have ${m.units}`)};
  if(m.payback==null) return {c:"bad",t:L("ไม่คุ้ม","Not feasible"),d:L("รายได้ไม่พอค่าใช้จ่ายรายเดือน","Revenue does not cover monthly costs")};
  if(m.payback<=m.target) return {c:"good",t:L("คุ้ม","Feasible"),d:L(`คืนทุน ${fmt(m.payback,1)} เดือน ภายในเป้า ${fmt(m.target)} เดือน`,`Payback ${fmt(m.payback,1)} months, within the ${fmt(m.target)}-month target`)};
  if(m.payback<=m.target*1.5) return {c:"warn",t:L("พอได้ แต่ช้ากว่าเป้า","Workable but slower than target"),d:L(`คืนทุน ${fmt(m.payback,1)} เดือน (เป้า ${fmt(m.target)})`,`Payback ${fmt(m.payback,1)} months (target ${fmt(m.target)})`)};
  return {c:"bad",t:L("คืนทุนช้าเกินไป","Payback too slow"),d:L(`คืนทุน ${fmt(m.payback,1)} เดือน (เป้า ${fmt(m.target)})`,`Payback ${fmt(m.payback,1)} months (target ${fmt(m.target)})`)};
}
const mo=v=>v==null?"–":fmt(v,1)+" "+L("เดือน","mo");

/* ---------- shared pieces ---------- */
function scBar(){
  const sc=cur();
  return `<div class="scbar" role="group" aria-label="${L("แบบราคา","Pricing plans")}">${S.scen.map((s,i)=>`<button class="pillb" data-a="pick" data-i="${i}" aria-pressed="${i===S.active}" data-o="pill-${i}">${esc(s.name)}</button>`).join("")}<button class="pillb add" data-a="addScen">+ ${L("เพิ่มแบบ","Add plan")}</button></div>
  <div class="scedit"><input type="text" data-b="scen.${S.active}.name" data-t="s" value="${esc(sc.name)}" aria-label="${L("ชื่อแบบ","Plan name")}">
    <button class="link" data-a="dupScen">${L("ทำสำเนา","Duplicate")}</button>${S.scen.length>1?`<button class="link del" data-a="delScen">${L("ลบแบบนี้","Delete")}</button>`:""}</div>`;
}
function stats(m){
  const v=verdict(m);
  return `<div class="stats">
    <div class="stat"><div class="k">${L("รายได้ต่อเดือน","Revenue / month")}</div><div class="v num">${baht(m.rev)}</div><div class="n">${fmt(m.people)} ${L("คน","people")} · ${fmt(m.sessions)} ${L("ครั้ง","sessions")}</div></div>
    <div class="stat"><div class="k">${L("กำไรต่อเดือน","Profit / month")}</div><div class="v num">${baht(m.net)}</div><div class="n">${L("หลังหักค่าใช้จ่าย","after costs")}</div></div>
    <div class="stat"><div class="k">${L("คืนทุน","Payback")}</div><div class="v num">${mo(m.payback)}</div><div class="n">${L("ลงทุน","invest")} ${baht(m.invest)}</div></div>
    <div class="stat"><div class="k">${L("ผล","Result")}</div><div class="v"><span class="badge ${v.c}" style="font-size:14px">${v.t}</span></div><div class="n">${L("ใช้เครื่อง","Utilisation")} ${fmt(m.util*100)}%</div></div>
  </div>`;
}

/* ---------- tab 1: pricing ---------- */
function viewPrice(){
  const sc=cur(), m=metrics(sc), day=benchDay();
  let h=`<h1>${L("ตั้งราคา","Set prices")}</h1><p class="sub">${L("ใส่ราคาต่อ 1 เครื่องตามระยะเวลาที่ใช้ แล้วเทียบกับราคาอ้างอิงและราคาขั้นต่ำที่คุ้มทุน","Enter the price per machine for each duration, then compare with the benchmark and the break-even floor.")}</p>`;
  h+=scBar();
  h+=`<div data-o="p-stats">${stats(m)}</div>`;
  h+=`<div class="card"><div class="quick">
    <div class="q"><label for="qh">${L("ตั้งทุกช่วงจากราคาต่อชั่วโมง (บาท)","Fill all from an hourly price (฿)")}</label><div class="r"><input type="text" inputmode="decimal" id="qh" value="${n(sc.prices[60])||150}"><button class="btn" data-a="fillHour">${L("ใช้","Apply")}</button></div></div>
    <div class="q"><label for="qp">${L("ตั้งทุกช่วงเป็น % ของราคาอ้างอิง","Fill all as % of benchmark")}</label><div class="r"><input type="text" inputmode="decimal" id="qp" value="10"><button class="btn ghost" data-a="fillPct">${L("ใช้","Apply")}</button></div></div>
  </div></div>`;
  h+=`<h2>${L("ราคาตามระยะเวลา","Price by duration")}</h2><p class="hint">${L("ราคาต่อ 1 เครื่อง (1 คน) ต่อ 1 ครั้ง","Price per machine (one person) per session")}</p>`;
  S.durations.forEach(D=>{
    const b=benchAt(D), p=n(sc.prices[D]);
    const chips=[];
    if(p>0){ chips.push(`<span class="badge neu num">฿${fmt(p/D,2)}/${L("นาที","min")}</span>`);
      if(D!==60) chips.push(`<span class="badge neu num">${L("เท่ากับ","=")} ${baht(p/D*60)}/${L("ชม.","hr")}</span>`);
      if(b) chips.push(`<span class="badge neu num">${fmt(p/b.mid*100)}% ${L("ของราคาอ้างอิง","of benchmark")}</span>`);
      if(m.factor!=null){ const fl=p*m.factor; chips.push(`<span class="badge ${p>=fl?"good":"bad"} num">${L("ขั้นต่ำคุ้มทุน","break-even floor")} ${baht(fl)}</span>`); } }
    h+=`<div class="drow"><div class="dl"><b>${durLabel(D)}</b><span data-o="b-${D}">${b?`${L("ราคาอ้างอิง","Benchmark")} ${baht(b.mid)} <span class="num">(${baht(b.lo)}–${baht(b.hi)})</span>`:L("ไม่มีราคาอ้างอิง","No benchmark")}</span></div>
      <div class="dp">฿<input type="text" inputmode="decimal" data-b="scen.${S.active}.prices.${D}" value="${p||""}" placeholder="0" aria-label="${L("ราคา","Price")} ${durLabel(D)}"></div>
      <button class="x" data-a="delDur" data-i="${D}" aria-label="${L("ลบช่วงเวลา","Remove duration")} ${durLabel(D)}">×</button>
      <div class="chips" data-o="c-${D}">${chips.join("")}</div></div>`;
  });
  h+=`<div class="addrow"><input type="text" inputmode="numeric" id="newDur" placeholder="${L("เช่น 75","e.g. 75")}" aria-label="${L("ระยะเวลาใหม่ (นาที)","New duration (minutes)")}"><span class="hint" style="margin:0">${L("นาที","minutes")}</span><button class="link" data-a="addDur">+ ${L("เพิ่มช่วงเวลา","Add duration")}</button></div>`;
  h+=`<p class="hint" data-o="p-note">${L(`ราคาขั้นต่ำคุ้มทุน คือราคาที่ทำให้คืนทุนใน ${fmt(m.target)} เดือน ถ้าลูกค้าเท่าที่ใส่ไว้ในหน้า "ลูกค้าและความคุ้ม"`,`The break-even floor is the price that pays back in ${fmt(m.target)} months with the customers entered under "Customers & feasibility".`)}${day?` · ${L("ราคาเช่าทั้งวันในต่างประเทศ ปรับเป็นราคาไทยแล้ว ประมาณ","Overseas full-day rental, Thai-adjusted, about")} ${baht(day.mid)} (${baht(day.lo)}–${baht(day.hi)})`:""}</p>`;
  return h;
}

/* ---------- tab 2: customers & feasibility ---------- */

  return `<div class="verdict ${v.c}"><b>${v.t}</b>${v.d}</div>
  <div class="rl">
    <div class="r"><span>${L("ลูกค้าทั้งหมด","Customers")}</span><b class="num">${fmt(m.people)} ${L("คน","people")}</b></div>
    <div class="r"><span>${L("จำนวนครั้งต่อเดือน","Sessions / month")}</span><b class="num">${fmt(m.sessions)}</b></div>
    <div class="r tot"><span>${L("รายได้ต่อเดือน","Revenue / month")}</span><b class="num">${baht(m.rev)}</b></div>
    <div class="r"><span>${L("กันเงินซ่อม","Repair reserve")} ${fmt(S.cost.reservePct)}%</span><b class="num">−${baht(m.reserve)}</b></div>
    <div class="r"><span>${L("ค่าใช้จ่ายอื่นต่อเดือน","Other monthly costs")}</span><b class="num">−${baht(S.cost.otherMonthly)}</b></div>
    <div class="r tot"><span>${L("กำไรต่อเดือน","Profit / month")}</span><b class="num">${baht(m.net)}</b></div>
    <div class="r"><span>${L("เงินลงทุน","Investment")} (${fmt(m.units)} ${L("เครื่อง","units")})</span><b class="num">${baht(m.invest)}</b></div>
    <div class="r tot"><span>${L("คืนทุน","Payback")}</span><b class="num">${mo(m.payback)}</b></div>
    <div class="r"><span>${L(`ลูกค้าขั้นต่ำให้คืนทุนใน ${fmt(m.target)} เดือน`,`Customers needed for ${fmt(m.target)}-month payback`)}</span><b class="num">${m.minPeople!=null?fmt(m.minPeople)+" "+L("คน","people"):"–"}</b></div>
    <div class="r"><span style="flex:1">${L("ชั่วโมงเครื่องที่ใช้ / รองรับได้","Machine-hours used / capacity")}<div class="bar"><i style="width:${u}%;${m.util>1?"background:var(--bad)":""}"></i></div></span><b class="num">${fmt(m.mh)} / ${fmt(m.cap)} (${fmt(m.util*100)}%)</b></div>
    <div class="r"><span>${L("เครื่องที่ต้องใช้จริง","Units actually needed")}</span><b class="num">${fmt(m.unitsNeed)} ${L("เครื่อง","units")}</b></div>
  </div>`;
}
const COST=[["machinePrice","ราคาเครื่อง (บาท/เครื่อง)","Machine price (฿/unit)"],["startupOther","ค่าเริ่มต้นอื่น (บาท)","Other start-up cost (฿)"],["otherMonthly","ค่าใช้จ่ายอื่นต่อเดือน (ส่ง ทำความสะอาด)","Other monthly costs (delivery, cleaning)"],["reservePct","กันเงินซ่อม (% ของรายได้)","Repair reserve (% of revenue)"],["hoursPerDay","เครื่องใช้ได้กี่ชั่วโมงต่อวัน","Usable hours per day"],["daysPerWeek","ให้บริการกี่วันต่อสัปดาห์","Service days per week"],["target","เป้าคืนทุน (เดือน)","Payback target (months)"]];
function viewFeas(){
  const sc=cur(), m=metrics(sc);
  let h=`<h1>${L("ลูกค้าและความคุ้ม","Customers & feasibility")}</h1><p class="sub">${L("ใส่ว่ามีลูกค้าประมาณกี่คน ใช้บ่อยแค่ไหน แล้วดูว่าราคาที่ตั้งไว้คุ้มหรือไม่","Estimate how many customers you have and how often they use it, then see whether your prices work.")}</p>`;
  h+=scBar();
  h+=`<h2>${L("กลุ่มลูกค้า","Customer groups")}</h2><p class="hint">${L("จำนวนคนเป็นค่าประมาณ แก้ให้ตรงกับจำนวนจริงของแต่ละทีม","Head counts are estimates. Change them to each team's real numbers.")}</p>`;
  sc.groups.forEach((g,i)=>{ const x=m.gs[i], pre=`scen.${S.active}.groups.${i}`;
    h+=`<div class="g"><div class="gh"><input type="text" data-b="${pre}.name" data-t="s" value="${esc(g.name)}" aria-label="${L("ชื่อกลุ่ม","Group name")}"><button class="x" data-a="delGroup" data-i="${i}" aria-label="${L("ลบกลุ่ม","Remove group")}">×</button></div>
      <div class="gf">
        <div class="f"><label>${L("จำนวนคน","People")}</label><input type="text" inputmode="numeric" data-b="${pre}.people" value="${g.people}"></div>
        <div class="f"><label>${L("ครั้งต่อคนต่อสัปดาห์","Sessions / person / week")}</label><input type="text" inputmode="decimal" data-b="${pre}.perWeek" value="${g.perWeek}"></div>
        <div class="f"><label>${L("ใช้ครั้งละ","Duration")}</label><select data-b="${pre}.min">${[...new Set([...S.durations,g.min])].sort((a,b)=>a-b).map(D=>`<option value="${D}" ${D===g.min?"selected":""}>${durLabel(D)}</option>`).join("")}</select></div>
        <div class="f"><label>${L("ส่วนลดกลุ่ม (%)","Group discount (%)")}</label><input type="text" inputmode="decimal" data-b="${pre}.disc" value="${g.disc}"></div>
      </div>
      <div class="go num" data-o="g-${i}">${baht(x.price)}/${L("ครั้ง","session")} · ${fmt(x.ses)} ${L("ครั้ง/เดือน","sessions/mo")} · <b>${baht(x.rev)}/${L("เดือน","mo")}</b></div></div>`; });
  h+=`<button class="link" data-a="addGroup">+ ${L("เพิ่มกลุ่มลูกค้า","Add customer group")}</button>`;
  h+=`<h2>${L("จำนวนเครื่อง","Machines")}</h2><div class="step"><button data-a="units" data-i="-1" aria-label="${L("ลดเครื่อง","Fewer units")}">−</button><b class="num" data-o="units">${fmt(sc.units)} ${L("เครื่อง","units")}</b><button data-a="units" data-i="1" aria-label="${L("เพิ่มเครื่อง","More units")}">+</button></div>`;
  h+=`<h2>${L("ผลความคุ้ม","Feasibility result")}</h2><div data-o="f-res">${resList(m)}</div>`;
  h+=`<details class="set" id="setBox" ${setOpen?"open":""}><summary>${L("ต้นทุนและสมมติฐาน (ใช้กับทุกแบบ)","Costs and assumptions (all plans)")}</summary><div class="grid">${COST.map(([k,th,en])=>`<div class="f"><label for="c-${k}">${L(th,en)}</label><input type="text" inputmode="decimal" id="c-${k}" data-b="cost.${k}" value="${S.cost[k]}"></div>`).join("")}</div></details>`;
  return h;
}

/* ---------- tab 3: compare ---------- */
function viewCompare(){
  const ms=S.scen.map(metrics), k=S.scen.length;
  const ok=ms.map((m,i)=>m.payback!=null&&m.util<=1?i:-1).filter(i=>i>=0);
  const best=ok.length?ok.reduce((a,b)=>ms[a].payback<=ms[b].payback?a:b):-1;
  const item=(label,cells,ref)=>`<div class="row item"><div class="label">${label}</div><div class="cell ref">${ref||""}</div>${cells.map(c=>`<div class="cell">${c}</div>`).join("")}</div>`;
  const sec=(t,s)=>`<div class="sec">${t}${s?`<small>${s}</small>`:""}</div>`;
  const headD=S.durations.includes(60)?60:S.durations[0];
  const b0=benchAt(headD);
  let h=`<h1>${L("เปรียบเทียบ","Compare")}</h1><p class="sub">${L("ดูทุกแบบเรียงกันเป็นคอลัมน์ เทียบกับราคาอ้างอิง","See every plan side by side, next to the benchmark.")}</p>`;
  h+=`<div class="cmp-scroll"><div class="cmp" style="--cols:minmax(130px,1.2fr) repeat(${k+1},minmax(116px,1fr));--minw:${130+(k+1)*116}px">`;
  h+=`<div class="row colhead"><div class="cell" style="justify-items:start;text-align:left"><span class="name">${L("ราคาต่อ 1 เครื่อง","Price per machine")}</span><span class="name">${durLabel(headD)}</span></div>
    <div class="cell ref"><span class="name">${L("ราคาอ้างอิง","Benchmark")}</span><span class="price num">${b0?baht(b0.mid):"–"}</span><span class="badge neu">${L("ตลาด","Market")}</span></div>
    ${S.scen.map((s,i)=>`<div class="cell"><span class="name">${esc(s.name)}</span><span class="price num">${baht(n(s.prices[headD]))}</span>${i===best?`<span class="badge good">${L("คืนทุนเร็วสุด","Fastest payback")}</span>`:""}<button class="link" data-a="edit" data-i="${i}">${L("แก้แบบนี้","Edit")}</button></div>`).join("")}</div>`;
  h+=sec(L("ราคา","Prices"),L("ต่อ 1 เครื่องต่อครั้ง · % คือเทียบกับราคาอ้างอิง","Per machine per session · % is versus the benchmark"));
  S.durations.forEach(D=>{ const b=benchAt(D);
    h+=item(`<b>${durLabel(D)}</b>`,S.scen.map(s=>{ const p=n(s.prices[D]); return p?`<span class="v num">${baht(p)}</span><span class="note num">฿${fmt(p/D,2)}/${L("นาที","min")}${b?` · ${fmt(p/b.mid*100)}%`:""}</span>`:`<span class="note">–</span>`; }),b?`<span class="v num">${baht(b.mid)}</span><span class="note num">${baht(b.lo)}–${baht(b.hi)}</span>`:`<span class="note">–</span>`); });
  h+=sec(L("ลูกค้า","Customers"));
  h+=item(`<b>${L("จำนวนลูกค้า","Customers")}</b>`,ms.map(m=>`<span class="v num">${fmt(m.people)}</span><span class="note">${L("คน","people")}</span>`));
  h+=item(`<b>${L("จำนวนครั้ง","Sessions")}</b>${L("ต่อเดือน","per month")}`,ms.map(m=>`<span class="v num">${fmt(m.sessions)}</span>`));
  h+=item(`<b>${L("ลูกค้าขั้นต่ำ","Customers needed")}</b>${L("ให้คืนทุนตามเป้า","to hit the payback target")}`,ms.map(m=>`<span class="v num">${m.minPeople!=null?fmt(m.minPeople):"–"}</span>${m.minPeople!=null?`<span class="badge ${m.people>=m.minPeople?"good":"bad"}">${m.people>=m.minPeople?L("มีพอ","Enough"):L("ยังไม่พอ","Short")}</span>`:""}`));
  h+=sec(L("รายได้และกำไร","Revenue and profit"),L("ต่อเดือน","Per month"));
  h+=item(`<b>${L("รายได้","Revenue")}</b>`,ms.map(m=>`<span class="v num">${baht(m.rev)}</span>`));
  h+=item(`<b>${L("ค่าใช้จ่าย","Costs")}</b>${L("กันซ่อม + อื่น ๆ","reserve + other")}`,ms.map(m=>`<span class="v num">${baht(m.rev-m.net)}</span>`));
  h+=item(`<b>${L("กำไร","Profit")}</b>`,ms.map(m=>`<span class="v num">${baht(m.net)}</span>`));
  h+=sec(L("ความคุ้ม","Feasibility"));
  h+=item(`<b>${L("เงินลงทุน","Investment")}</b>`,ms.map(m=>`<span class="v num">${baht(m.invest)}</span><span class="note">${fmt(m.units)} ${L("เครื่อง","units")}</span>`));
  h+=item(`<b>${L("คืนทุน","Payback")}</b>`,ms.map(m=>`<span class="v num">${mo(m.payback)}</span>`));
  h+=item(`<b>${L("ใช้เครื่อง","Utilisation")}</b>${L("ของเวลาที่รองรับได้","of capacity")}`,ms.map(m=>`<span class="v num">${fmt(m.util*100)}%</span><span class="note">${L("ต้องใช้","needs")} ${fmt(m.unitsNeed)} ${L("เครื่อง","units")}</span>`));
  h+=item(`<b>${L("ผล","Result")}</b>`,ms.map(m=>{ const v=verdict(m); return `<span class="badge ${v.c}">${v.t}</span>`; }));
  h+=`</div></div><div class="addrow"><button class="link" data-a="addScen">+ ${L("เพิ่มแบบเพื่อเทียบ","Add a plan to compare")}</button></div>`;
  return h;
}

/* ---------- tab 4: benchmarks ---------- */

}

  h+=`<div class="card" data-o="bn-sum">${benchSum()}</div>`;
  h+=`<div class="grid" style="margin:14px 0">
    <div class="f"><label for="c-lf">${L("ราคาต่างประเทศคิดเป็นกี่ % ของราคาไทย","Overseas prices count at this % for Thailand")}</label><input type="text" inputmode="decimal" id="c-lf" data-b="cost.localFactor" value="${S.cost.localFactor}"></div>
    <div class="f"><label for="c-exp">${L("ยิ่งนานยิ่งถูกต่อนาที (1 = ไม่ลด, 0.85 = ค่าเริ่มต้น)","Longer is cheaper per minute (1 = none, 0.85 = default)")}</label><input type="text" inputmode="decimal" id="c-exp" data-b="cost.exp" value="${S.cost.exp}"></div></div>`;
  h+=`<h2>${L("รายการ","Entries")}</h2><p class="hint">${L("แบบ \"ต่อครั้ง\" ใช้คำนวณราคาอ้างอิงตามระยะเวลา · แบบ \"เช่าต่อวัน\" แสดงเป็นข้อมูลประกอบ","\"Per session\" entries feed the duration benchmark. \"Rent per day\" entries are shown for context.")}</p>`;
  S.bench.forEach((b,i)=>{ const pre=`bench.${i}`;
    h+=`<div class="bn"><label class="sw"><input type="checkbox" data-b="${pre}.use" ${b.use?"checked":""} aria-label="${L("ใช้รายการนี้","Use this entry")}"><i></i></label>
      <div class="bf">
        <div class="f"><label>${L("ชื่อ","Name")}</label><input type="text" data-b="${pre}.name" data-t="s" value="${esc(b.name)}"></div>
        <div class="f"><label>${L("ราคา (บาท)","Price (฿)")}</label><input type="text" inputmode="decimal" data-b="${pre}.price" value="${b.price}"></div>
        <div class="f"><label>${L("นาที","Minutes")}</label><input type="text" inputmode="numeric" data-b="${pre}.min" value="${b.type==="day"?"":b.min}" ${b.type==="day"?"disabled":""}></div>
        <div class="f"><label>${L("แบบ","Type")}</label><select data-b="${pre}.type" data-t="s"><option value="session" ${b.type==="session"?"selected":""}>${L("ต่อครั้ง","Per session")}</option><option value="day" ${b.type==="day"?"selected":""}>${L("เช่าต่อวัน","Rent per day")}</option></select></div>
      </div>
      <div class="bm"><select data-b="${pre}.th" data-t="b" style="width:auto;padding:4px 8px;font-size:13px" aria-label="${L("ประเทศ","Country")}"><option value="1" ${b.th?"selected":""}>${L("ไทย","Thailand")}</option><option value="0" ${!b.th?"selected":""}>${L("ต่างประเทศ","Overseas")}</option></select>
        ${b.note?`<span>${esc(b.note)}</span>`:""}${b.url?`<a href="${esc(b.url)}" target="_blank" rel="noopener">${L("แหล่งที่มา","Source")}</a>`:`<span>${L("เพิ่มเอง","Added by you")}</span>`}
        <button class="link del" data-a="delBench" data-i="${i}">${L("ลบ","Remove")}</button></div></div>`; });
  h+=`<div class="addrow"><button class="link" data-a="addBench">+ ${L("เพิ่มราคาอ้างอิง","Add a benchmark")}</button></div>`;
  h+=`<p class="hint">${L("ราคาต่างประเทศแปลงเป็นบาทด้วยอัตราโดยประมาณ (US$1 = ฿33, €1 = ฿38, £1 = ฿43.5) แก้ตัวเลขได้เองถ้าอัตราเปลี่ยน","Overseas prices are converted at approximate rates (US$1 = ฿33, €1 = ฿38, £1 = ฿43.5). Edit the figures if rates move.")}</p>`;
  return h;
}

/* ---------- render ---------- */
const VIEWS={price:viewPrice,feas:viewFeas,compare:viewCompare,bench:viewBench};
function chrome(){
  document.documentElement.lang=S.lang;
  const T=[["price",L("ตั้งราคา","Pricing")],["feas",L("ลูกค้าและความคุ้ม","Feasibility")],["compare",L("เปรียบเทียบ","Compare")],["bench",L("ราคาอ้างอิง","Benchmarks")]];
  $("#tabs").innerHTML=T.map(([k,t])=>`<button data-tab="${k}" ${k===tab?'aria-current="page"':""}>${t}</button>`).join("");
  $("#langBtn").textContent=S.lang==="th"?"EN":"ไทย";
  $("#fBackup").textContent=L("สำรองข้อมูล","Back up"); $("#fRestore").textContent=L("นำข้อมูลกลับ","Restore"); $("#fPrint").textContent=L("พิมพ์ / PDF","Print / PDF"); $("#fReset").textContent=L("คืนค่าเริ่มต้น","Reset");
  $("#fNote").textContent=L("ข้อมูลเก็บในเครื่องนี้เท่านั้น","Data stays on this device");
}
function render(){ chrome(); $("#out").innerHTML=VIEWS[tab](); }
function patch(){ const tmp=document.createElement("div"); tmp.innerHTML=VIEWS[tab]();
  tmp.querySelectorAll("[data-o]").forEach(nw=>{ const old=$("#out").querySelector(`[data-o="${nw.dataset.o}"]`); if(old&&old.innerHTML!==nw.innerHTML) old.innerHTML=nw.innerHTML; }); }
function go(t){ tab=t; try{ history.replaceState(null,"","#"+t); }catch(e){} render(); window.scrollTo(0,0); }

/* ---------- events ---------- */
function setPath(path,val){ const ks=path.split("."); let o=S; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=val; }
function bind(t){ const p=t.dataset.b; if(!p) return false;
  const val=t.type==="checkbox"?t.checked : t.dataset.t==="s"?t.value : t.dataset.t==="b"?t.value==="1" : n(t.value);
  setPath(p,val); save(); return true; }
document.addEventListener("input",e=>{ const t=e.target; if(t.tagName==="SELECT"||t.type==="checkbox") return; if(bind(t)) patch(); });
document.addEventListener("change",e=>{ const t=e.target;
  if(t.id==="restoreFile"){ const f=t.files[0]; if(!f) return; f.text().then(x=>{ const d=JSON.parse(x); if(d&&d.v===2&&Array.isArray(d.scen)&&d.scen.length){ S=Object.assign(clone(DEFAULT),d); save(); render(); toast(L("นำข้อมูลกลับแล้ว","Restored")); } else toast(L("ไฟล์ไม่ถูกต้อง","Invalid file")); }).catch(()=>toast(L("ไฟล์ไม่ถูกต้อง","Invalid file"))); t.value=""; return; }
  if((t.tagName==="SELECT"||t.type==="checkbox")&&bind(t)) render(); });
document.addEventListener("toggle",e=>{ if(e.target.id==="setBox") setOpen=e.target.open; },true);
document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-tab]"); if(tb){ go(tb.dataset.tab); return; }
  const a=e.target.closest("[data-a]"); if(!a) return; const act=a.dataset.a, i=a.dataset.i, sc=cur();
  if(act==="pick"){ S.active=+i; }
  else if(act==="edit"){ S.active=+i; save(); go("price"); return; }
  else if(act==="addScen"||act==="dupScen"){ const c=clone(sc); c.name=sc.name+" "+L("(สำเนา)","(copy)"); S.scen.push(c); S.active=S.scen.length-1; toast(L("เพิ่มแบบใหม่จากแบบปัจจุบัน","New plan copied from the current one")); if(tab==="compare"){ save(); go("price"); return; } }
  else if(act==="delScen"){ if(S.scen.length>1){ S.scen.splice(S.active,1); S.active=Math.max(0,S.active-1); } }
  else if(act==="fillHour"){ const H=n($("#qh").value), ex=n(S.cost.exp)||1; if(H>0){ S.durations.forEach(D=>sc.prices[D]=D===60?H:r5(H*Math.pow(D/60,ex))); toast(L("ตั้งราคาทุกช่วงแล้ว","All durations filled")); } }
  else if(act==="fillPct"){ const P=n($("#qp").value); let ok=false; if(P>0) S.durations.forEach(D=>{ const b=benchAt(D); if(b){ sc.prices[D]=r5(b.mid*P/100); ok=true; } }); toast(ok?L("ตั้งราคาทุกช่วงแล้ว","All durations filled"):L("ยังไม่มีราคาอ้างอิง","No benchmark yet")); }
  else if(act==="addDur"){ const D=Math.round(n($("#newDur").value)); if(D>=5&&D<=600&&!S.durations.includes(D)){ S.durations.push(D); S.durations.sort((x,y)=>x-y); } else { toast(L("ใส่จำนวนนาทีที่ยังไม่มี (5–600)","Enter a new duration (5–600 minutes)")); return; } }
  else if(act==="delDur"){ if(S.durations.length>1) S.durations=S.durations.filter(D=>D!==+i); }
  else if(act==="addGroup"){ sc.groups.push({name:L("กลุ่มใหม่","New group"),people:10,perWeek:2,min:S.durations[0],disc:0}); }
  else if(act==="delGroup"){ sc.groups.splice(+i,1); }
  else if(act==="units"){ sc.units=Math.max(1,n(sc.units)+(+i)); }
  else if(act==="addBench"){ S.bench.push({name:L("ราคาอ้างอิงใหม่","New benchmark"),price:1000,min:30,type:"session",th:true,use:true,url:"",note:""}); }
  else if(act==="delBench"){ S.bench.splice(+i,1); }
  else if(act==="print"){ window.print(); return; }
  else if(act==="backup"){ const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"})); const l=document.createElement("a"); l.href=u; l.download="normatec-pricing.json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); return; }
  else if(act==="reset"){ if(a.dataset.sure){ const lang=S.lang; S=clone(DEFAULT); S.lang=lang; toast(L("คืนค่าเริ่มต้นแล้ว","Reset done")); } else { a.dataset.sure="1"; a.textContent=L("กดอีกครั้งเพื่อยืนยัน","Tap again to confirm"); setTimeout(()=>{ delete a.dataset.sure; a.textContent=L("คืนค่าเริ่มต้น","Reset"); },3000); return; } }
  else return;
  save(); render();
});
$("#langBtn").onclick=()=>{ S.lang=S.lang==="th"?"en":"th"; save(); render(); };
window.addEventListener("hashchange",()=>{ const t=location.hash.slice(1); if(VIEWS[t]&&t!==tab){ tab=t; render(); } });
render();
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{ const w=reg.installing; w&&w.addEventListener("statechange",()=>{ if(w.state==="installed" && navigator.serviceWorker.controller) toast("มีเวอร์ชันใหม่ · ปิดแล้วเปิดแอปอีกครั้งเพื่ออัปเดต"); }); });
  }).catch(()=>{}));
}
})();
</script>
</body>
